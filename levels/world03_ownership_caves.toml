goal = "撰寫 `add_star`，讓程式印出：Ferris★★"
lesson = '''
函式可以取得所有權，並透過回傳值**將所有權交還**：

```rust
fn shine(mut s: String) -> String {
    s.push_str("!");
    s                  // 所有權移回呼叫端
}
```

`push_str` 會將文字附加到 `String`。因為它會修改字串，所以參數必須標示為 `mut`。

注意 `main` 如何使用**遮蔽**接住回傳值：`let name = add_star(name);`。
'''
c_compare = '''
類似 C 函式接收以 `malloc` 配置的緩衝區，可能呼叫 `realloc`，再回傳（可能已改變的）指標。在 Rust 中，編譯器會檢查你是否使用回傳值，而不是繼續使用舊指標。
'''
py_compare = '''
類似 Python 的 `name = add_star(name)`，但在 Rust 中，呼叫後舊的 `name` 確實不再有效，必須重新指派才能使用。
'''
check = "output"
expected_output = "Ferris★★"
starter = '''
// TODO：撰寫 `fn add_star(...) -> String`
// 它要取得 String 的所有權，在結尾加上「★」，再回傳字串。

fn main() {
    let name = String::from("Ferris");
    let name = add_star(name);
    let name = add_star(name);
    println!("{}", name);
}
'''
solution = '''
fn add_star(mut s: String) -> String {
    s.push_str("★");
    s
}

fn main() {
    let name = String::from("Ferris");
    let name = add_star(name);
    let name = add_star(name);
    println!("{}", name);
}
'''
hints = [
    "這個函式還不存在。它的參數型別和回傳型別應該是什麼？",
    "函式簽章是 `fn add_star(mut s: String) -> String`：用 `push_str` 附加文字，最後讓 `s` 作為回傳值。",
    "```rust\nfn add_star(mut s: String) -> String {\n    s.push_str(\"★\");\n    s\n}\n```",
]

