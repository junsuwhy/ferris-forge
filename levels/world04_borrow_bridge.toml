}
'''
solution = '''
fn middle(items: &[i32]) -> &[i32] {
    if items.len() < 2 {
        &[]
    } else {
        &items[1..items.len() - 1]
    }
}

fn main() {
    println!("{:?}", middle(&[1, 2, 3, 4]));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn four_items() {
        assert_eq!(middle(&[1, 2, 3, 4]), &[2, 3]);
    }

    #[test]
    fn from_a_vec() {
        let v = vec![5, 6, 7];
        assert_eq!(middle(&v), &[6]);
    }

    #[test]
    fn too_short() {
        assert_eq!(middle(&[7]), &[] as &[i32]);
        assert_eq!(middle(&[]), &[] as &[i32]);
    }
}
'''
