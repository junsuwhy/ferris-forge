[[level]]
id = "4.4"
title = "一次只能有一位畫家"
kind = "fix"
book = ["4.2"]
xp = 40
goal = "修正程式，讓它印出：Score: 20"
lesson = '''
Rust 借用的黃金法則：

> 在任何時刻，你**可以有多個**讀取者（`&`），**或一個**寫入者（`&mut`），但不能同時存在。

同一時間對同一個值建立兩個 `&mut` 借用會產生錯誤 **E0499**。

不過借用只會持續到**最後一次使用**。因此先使用第一個借用，*再*建立第二個：

```rust
let a = &mut x;
*a += 1;         // a 最後一次使用
let b = &mut x;  // 現在就可以了！
*b += 1;
```

`*a` 表示「`a` 所指向的值」。
'''
c_compare = '''
在 C 中，同時透過兩個指標修改相同資料會造成資料競爭和別名錯誤。Rust 直接禁止這種情況。
'''
py_compare = '''
在 Python 中，透過兩個名稱修改同一個物件很常見。Rust 則要求修改必須依序進行。
'''
check = "output"
expected_output = "Score: 20"
starter = '''
fn main() {
    let mut score = 10;
    let a = &mut score;
    let b = &mut score;
    *a += 5;
    *b += 5;
    println!("Score: {}", score);
}
'''
solution = '''
fn main() {
    let mut score = 10;
    let a = &mut score;
    *a += 5;
    let b = &mut score;
    *b += 5;
    println!("Score: {}", score);
}
'''
hints = [
    "目前同時存在兩個可變借用。能不能先用完第一個，再建立第二個？",
    "把 `*a += 5;` 移到前面，讓 `a` 在建立 `b` 之前就結束使用。",
    "依序排列這幾行：`let a = &mut score;`、`*a += 5;`、`let b = &mut score;`、`*b += 5;`。",
]

