[[level]]
id = "2.7"
title = "Collatz 溪流"
kind = "fill"
book = ["3.5"]
xp = 40
goal = "撰寫 `collatz_steps(n)`，計算 n 到達 1 需要幾步。"
lesson = '''
只要條件成立，**`while`** 就會持續迴圈。

**Collatz 猜想**的規則是：`n` 為偶數就除以 2；`n` 為奇數就變成 `3n + 1`。請計算 `n` 到達 1 前經過的步數。（目前還沒有人證明這個過程一定會結束！）

可用到的寫法：
- `n % 2 == 0` 可用來檢查 `n` 是否為偶數
- 參數也可以設為可變：`fn f(mut n: u64)`
'''
c_compare = '''
`while (n != 1) { ... }` 可以直接改寫成 Rust。Rust 沒有 `do { } while`，但可以用 `loop` 搭配 `break` 達到相同效果。
'''
py_compare = '''
和 Python 的 `while n != 1:` 相同，只是 Rust 使用大括號，不用冒號。
'''
check = "tests"
starter = '''
fn collatz_steps(n: u64) -> u32 {
    todo!()
}

fn main() {
    println!("27 takes {} steps", collatz_steps(27));
}
'''
solution = '''
fn collatz_steps(mut n: u64) -> u32 {
    let mut steps = 0;
    while n != 1 {
        n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };
        steps += 1;
    }
    steps
}

fn main() {
    println!("27 takes {} steps", collatz_steps(27));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn one_is_already_done() {
        assert_eq!(collatz_steps(1), 0);
    }

    #[test]
    fn six_takes_eight_steps() {
        // 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1
        assert_eq!(collatz_steps(6), 8);
    }

    #[test]
    fn twenty_seven_takes_a_while() {
        assert_eq!(collatz_steps(27), 111);
    }
}
'''
hints = [
    "你需要步數計數器，以及一個在 `n` 不等於 1 時持續執行的迴圈。`n` 沒有標成 `mut` 的話可以改變嗎？",
    "把參數設為 `mut n: u64`，使用 `while n != 1`，並在迴圈內用 `if n % 2 == 0` 決定下一個值。每次都要累計步數。",
    "```rust\nfn collatz_steps(mut n: u64) -> u32 {\n    let mut steps = 0;\n    while n != 1 {\n        n = if n % 2 == 0 { n / 2 } else { 3 * n + 1 };\n        steps += 1;\n    }\n    steps\n}\n```",
]

[[level]]
id = "2.labels"
title = "逃出迴圈迷宮"
kind = "fill"
book = ["3.5"]
xp = 35
goal = '''找到第一組符合條件的配對時，停止**兩層**迴圈，讓程式印出：
3 x 4 = 12'''
lesson = '''
一般的 `break` 只會離開**最內層**迴圈。若要離開外層迴圈，請替它加上**標籤**（以 `'` 開頭的名稱）：

```rust
'outer: for a in 1..=5 {
    for b in 1..=5 {
        if a * b == 6 {
            break 'outer; // 一次離開兩層迴圈
        }
    }
}
```

`continue 'outer` 也能以相同方式使用標籤。
'''
c_compare = '''
在 C 中，你得使用 `goto` 或旗標變數。Rust 的標籤則提供安全且有結構的做法。
'''
py_compare = '''
Python 沒有迴圈標籤，通常要改用旗標，或把迴圈放進函式並用 `return` 離開。
'''
check = "output"
expected_output = "3 x 4 = 12"
starter = '''
fn main() {
    let mut found = (0, 0);
    for a in 1..=5 {
        for b in 1..=5 {
            if a * b == 12 {
                found = (a, b);
                // TODO：在這裡停止兩層迴圈
            }
        }
    }
    println!("{} x {} = 12", found.0, found.1);
}
'''
solution = '''
fn main() {
    let mut found = (0, 0);
    'outer: for a in 1..=5 {
        for b in 1..=5 {
            if a * b == 12 {
                found = (a, b);
                break 'outer;
            }
        }
    }
    println!("{} x {} = 12", found.0, found.1);
}
'''
hints = [
    "目前迴圈會繼續跑，之後還會找到其他配對。要怎麼在內層迴圈中停止外層迴圈？",
    "在第一個 `for` 前加上像 `'outer:` 這樣的標籤，再使用 `break 'outer;`。",
    "寫上 `'outer: for a in 1..=5 {`，再把 TODO 換成 `break 'outer;`。",
]

[[level]]
id = "2.8"
title = "頭目戰：FizzBuzz 擂台"
kind = "boss"
book = ["3.3", "3.5"]
xp = 70
goal = '''撰寫 `fizzbuzz(n)` 並回傳 `String`：
n 同時能被 3 和 5 整除時回傳 "FizzBuzz"；能被 3 整除時回傳 "Fizz"；能被 5 整除時回傳 "Buzz"；其他情況則回傳數字本身。'''
lesson = '''
**頭目戰！**用 Rust 解決經典的面試題。

若要*建立並擁有*文字，Rust 使用 **`String`**：

```rust
let s = String::from("Fizz");   // 文字 → String
let t = 42.to_string();         // 數字 → String
```

（一般的 `"Fizz"` 是 `&str`，也就是借用文字的檢視。你會在所有權洞窟和借用橋學到兩者的差異。）

提示：要先檢查「同時可被兩者整除」的情況。也別忘了 `if`／`else if`／`else` 是運算式，因此可以直接作為整個函式本體！
'''
c_compare = '''
在 C 中，你得寫入 `char` 緩衝區，並祈禱它夠大。`String` 會自行擴充，也會自行釋放記憶體。
'''
py_compare = '''
`String::from("Fizz")` 類似一般的 Python `str`，而 `n.to_string()` 類似 `str(n)`。
'''
check = "tests"
starter = '''
fn fizzbuzz(n: u32) -> String {
    todo!()
}

fn main() {
    for n in 1..=15 {
        println!("{}", fizzbuzz(n));
    }
}
'''
solution = '''
fn fizzbuzz(n: u32) -> String {
    if n % 15 == 0 {
        String::from("FizzBuzz")
    } else if n % 3 == 0 {
        String::from("Fizz")
    } else if n % 5 == 0 {
        String::from("Buzz")
    } else {
        n.to_string()
    }
}

fn main() {
    for n in 1..=15 {
        println!("{}", fizzbuzz(n));
    }
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn plain_numbers() {
        assert_eq!(fizzbuzz(1), "1");
        assert_eq!(fizzbuzz(98), "98");
    }

    #[test]
    fn fizz() {
        assert_eq!(fizzbuzz(3), "Fizz");
        assert_eq!(fizzbuzz(9), "Fizz");
    }

    #[test]
    fn buzz() {
        assert_eq!(fizzbuzz(5), "Buzz");
        assert_eq!(fizzbuzz(20), "Buzz");
    }

    #[test]
    fn fizzbuzz_both() {
        assert_eq!(fizzbuzz(15), "FizzBuzz");
        assert_eq!(fizzbuzz(45), "FizzBuzz");
    }
}
'''
hints = [
    "有四種情況。要按照什麼順序檢查，才不會讓 15 只被判定為「Fizz」？",
    "使用 `if n % 15 == 0 { ... } else if n % 3 == 0 { ... } else if ...`。每個分支都必須回傳 `String`：文字用 `String::from(\"Fizz\")`，數字則用 `n.to_string()`。",
    "```rust\nif n % 15 == 0 {\n    String::from(\"FizzBuzz\")\n} else if n % 3 == 0 {\n    String::from(\"Fizz\")\n} else if n % 5 == 0 {\n    String::from(\"Buzz\")\n} else {\n    n.to_string()\n}\n```",
]
