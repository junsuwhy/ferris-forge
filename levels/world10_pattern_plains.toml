[[level]]
id = "10.1"
title = "模式無所不在"
kind = "predict"
book = ["19.1"]
xp = 25
goal = "這段程式會印出什麼？"
lesson = '''
從第一次使用 `match` 開始，你就已經用過**模式**；它們其實也出現在許多其他地方：

```rust
let (a, b) = (1, 2);                  // let 接受模式，不只是名稱
for (i, ch) in "ab".chars().enumerate() { }   // for 也一樣
while let Some(top) = stack.pop() { }  // 模式符合時持續迴圈
fn show(&(x, y): &(i32, i32)) { }      // 函式參數也一樣
```

即使一般的 `let x = 5;` 也是模式：`x` 是能符合任何值並替它命名的模式。

模式描述值的**形狀**。如果值符合該形狀，模式中的名稱就會綁定到值的各個部分。
'''
c_compare = '''
C 沒有相同功能：你得手動寫 `int a = t.first; int b = t.second;`。模式可以一步拆解值，並由編譯器檢查形狀。
'''
py_compare = '''
類似 Python 的拆解指定（`a, b = 1, 2` 和 `for i, ch in enumerate("ab")`），但也適用於結構體和列舉，而且編譯器會在程式執行前檢查形狀。
'''
starter = '''
fn print_point(&(x, y): &(i32, i32)) {
    println!("({x}, {y})");
}

fn main() {
    let (a, b, c) = (1, 2, 3);
    println!("{a}{b}{c}");

    let mut stack = vec![1, 2, 3];
    while let Some(top) = stack.pop() {
        print!("{top}");
    }
    println!();

    for (i, ch) in "ab".chars().enumerate() {
        println!("{i}:{ch}");
    }

    print_point(&(5, -1));
}
'''
choices = [
    "123 / 123 / 0:a / 1:b / (5, -1)",
    "123 / 321 / 0:a / 1:b / (5, -1)",
    "無法編譯：函式參數不能使用模式",
    "123 / 321 / a:0 / b:1 / (5, -1)",
]
answer = 1
expected_output = '''
123
321
0:a
1:b
(5, -1)
'''
explanation = "`let (a, b, c)` 會拆解元組。`pop` 從尾端取值，因此 `while let` 依序取得 3、2、1，遇到 `None` 時停止。`enumerate` 會提供 `(索引, 項目)` 配對，而參數 `&(x, y)` 會拆解借用的元組。"

[[level]]
id = "10.2"
title = "符合時就處理：if let 與 let...else"
kind = "fill"
book = ["19.1"]
xp = 45
goal = "撰寫 `background`（使用 if let／else if 鏈）和 `parse_score`（使用兩個 let...else 檢查）。"
lesson = '''
只在意**一種**形狀時，完整的 `match` 會很冗長。`if let` 可以檢查單一模式：

```rust
if let Some(color) = favorite {
    println!("using {color}");
} else if is_tuesday {
    println!("green day");
} else if let Ok(age) = age {
    println!("age {age}");
} else {
    println!("blue");
}
```

你可以自由混用 `if let`、`else if` 和 `else if let`。

**`let...else`** 則相反，表示「必須符合這個模式，否則就離開目前流程」：

```rust
let Some((name, score)) = line.split_once(':') else {
    return None;   // else 區塊必須離開目前流程：return、break、continue 或 panic
};
// 從這裡開始可以使用 name 和 score
```
'''
c_compare = '''
`let...else` 類似你在 C 中撰寫的提早回傳檢查（`if (!p) return NULL;`），但它也會拆解值，供函式後續使用。
'''
py_compare = '''
`if let Some(x) = value:` 類似 `if (x := value) is not None:`。`let...else` 則是同時拆解值的防護子句。
'''
check = "tests"
starter = '''
use std::num::ParseIntError;

/// 選擇背景顏色：
/// - a favorite color, if there is one
/// - otherwise "green" on Tuesdays
/// - otherwise, if the age parsed: "purple" when over 30, else "orange"
/// - otherwise "blue"
fn background(favorite: Option<&str>, is_tuesday: bool, age: Result<u8, ParseIntError>) -> String {
    todo!()
}

/// "Ferris:7" -> Some(("Ferris", 7)). No ':' or a bad number -> None.
/// 兩次檢查都使用 let...else。
fn parse_score(line: &str) -> Option<(&str, u32)> {
    todo!()
}

fn main() {
    println!("{}", background(None, false, "34".parse()));
    println!("{:?}", parse_score("Ferris:7"));
}
'''
solution = '''
use std::num::ParseIntError;

/// 選擇背景顏色：
/// - a favorite color, if there is one
/// - otherwise "green" on Tuesdays
/// - otherwise, if the age parsed: "purple" when over 30, else "orange"
/// - otherwise "blue"
fn background(favorite: Option<&str>, is_tuesday: bool, age: Result<u8, ParseIntError>) -> String {
    if let Some(color) = favorite {
        color.to_string()
    } else if is_tuesday {
        "green".to_string()
    } else if let Ok(age) = age {
        if age > 30 { "purple".to_string() } else { "orange".to_string() }
    } else {
        "blue".to_string()
    }
}

/// "Ferris:7" -> Some(("Ferris", 7)). No ':' or a bad number -> None.
/// 兩次檢查都使用 let...else。
fn parse_score(line: &str) -> Option<(&str, u32)> {
    let Some((name, score)) = line.split_once(':') else {
        return None;
    };
    let Ok(score) = score.parse::<u32>() else {
        return None;
    };
    Some((name, score))
}

fn main() {
    println!("{}", background(None, false, "34".parse()));
    println!("{:?}", parse_score("Ferris:7"));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn favorite_wins() {
        assert_eq!(background(Some("red"), true, "40".parse()), "red");
    }

    #[test]
    fn tuesday_then_age() {
        assert_eq!(background(None, true, "40".parse()), "green");
        assert_eq!(background(None, false, "34".parse()), "purple");
        assert_eq!(background(None, false, "12".parse()), "orange");
        assert_eq!(background(None, false, "old".parse()), "blue");
    }

    #[test]
    fn scores() {
        assert_eq!(parse_score("Ferris:7"), Some(("Ferris", 7)));
        assert_eq!(parse_score("Corro:0"), Some(("Corro", 0)));
        assert_eq!(parse_score("no colon"), None);
        assert_eq!(parse_score("Ferris:lots"), None);
    }
}
'''
hints = [
    "`background` 要用一串 `if let ... else if ... else if let ... else`。`parse_score` 則需要兩行 `let ... else { return None; };`。",
    "`background` 從 `if let Some(color) = favorite { color.to_string() }` 開始。`parse_score` 先用 `split_once(':')`，再用 `parse::<u32>()`，兩者都搭配 `let ... else`。",
    "```rust\nlet Some((name, score)) = line.split_once(':') else {\n    return None;\n};\nlet Ok(score) = score.parse::<u32>() else {\n    return None;\n};\nSome((name, score))\n```",
]

[[level]]
id = "10.3"
title = "模式可能不符合"
kind = "fix"
book = ["19.2"]
xp = 40
goal = '''有些行沒有單字。請處理這種情況，讓程式印出：
first word: hello
no words
first word: crab'''
lesson = '''
模式分成兩種：

- **不可反駁模式**：一定符合。像 `x`、配對的 `(a, b)`、`Point { x, y }`。
- **可反駁模式**：可能不符合。`Some(x)` 遇到 `None` 時不符合；`Ok(v)` 遇到 `Err` 時不符合。

一般的 `let` 和 `for` 迴圈需要使用**不可反駁模式**，因為模式不符合時沒有合理的處理方式：

```rust
let Some(word) = first_word(line);   // error[E0005]：區域綁定中使用了可反駁模式
```

可反駁模式不符合時，請使用 `if let`、`let...else` 或 `match` 指定處理方式。（反過來說，`if let x = 5` 雖然能編譯，但會警告：這個 if 永遠不會是 false。）
'''
c_compare = '''
在 C 中，忘記處理 `NULL` 仍能編譯，之後才崩潰。Rust 則會拒絕編譯可能不符合的 `let`。
'''
py_compare = '''
類似 `a, b = [1]` 在執行時引發 `ValueError`，但 Rust 會在編譯時就抓到。
'''
check = "output"
expected_output = '''
first word: hello
no words
first word: crab
'''
starter = '''
fn first_word(text: &str) -> Option<&str> {
    text.split_whitespace().next()
}

fn main() {
    let lines = ["hello world", "", "  crab  "];
    for line in lines {
        let Some(word) = first_word(line);
        println!("first word: {word}");
    }
}
'''
solution = '''
fn first_word(text: &str) -> Option<&str> {
    text.split_whitespace().next()
}

fn main() {
    let lines = ["hello world", "", "  crab  "];
    for line in lines {
        let Some(word) = first_word(line) else {
            println!("no words");
            continue;
        };
        println!("first word: {word}");
    }
}
'''
hints = [
    "`Some(word)` 無法比對 `None`，所以一般的 `let` 不能處理這種情況。遇到空行時應該怎麼辦？",
    "在 `let` 後面加上 `else` 區塊：印出 `no words`，然後用 `continue` 處理下一行。（也可以用 `if let` 搭配 `else`。）",
    "```rust\nlet Some(word) = first_word(line) else {\n    println!(\"no words\");\n    continue;\n};\n```",
]

[[level]]
id = "10.4"
title = "模式工具箱"
kind = "fill"
book = ["19.3"]
xp = 45
goal = "使用 match 分支中的常值、`|` 和範圍，依重量分類岩石、依種類分類字元。"
lesson = '''
`match` 分支能比對的不只單一值：

```rust
match n {
    0 => "zero",            // 常值
    1 | 2 => "a couple",    // | 表示「或」
    3..=9 => "a few",       // 包含結尾的範圍
    _ => "lots",            // 其他所有情況
}
```

範圍可用於數字和 `char`：

```rust
match c {
    'a'..='j' => "較前面的字母",
    'k'..='z' => "較後面的字母",
    _ => "其他字元",
}
```

分支會**由上往下**依序檢查，第一個符合的分支就會執行。因此較前面的特定分支（例如母音）會優先於後面較廣泛的分支（例如所有字母）。
'''
c_compare = '''
類似內建範圍與多值 case 的 `switch`，但不必記得寫 `break`，而且編譯器會確認所有值都已涵蓋。
'''
py_compare = '''
Python 的 `match` 支援 `|`（`case 1 | 2:`）但不支援範圍；你得加上 `case n if 3 <= n <= 9:` 這類條件。
'''
check = "tests"
starter = '''
/// 0 -> "dust", 1 or 2 -> "pebble", 3 to 9 -> "rock", anything bigger -> "boulder"
fn sort_rock(weight: u32) -> &'static str {
    todo!()
}

/// a e i o u -> "vowel", other lowercase letters -> "consonant",
/// '0' to '9' -> "digit", anything else -> "other"
fn kind_of(c: char) -> &'static str {
    todo!()
}

fn main() {
    println!("{} {}", sort_rock(5), kind_of('e'));
}
'''
solution = '''
/// 0 -> "dust", 1 or 2 -> "pebble", 3 to 9 -> "rock", anything bigger -> "boulder"
fn sort_rock(weight: u32) -> &'static str {
    match weight {
        0 => "dust",
        1 | 2 => "pebble",
        3..=9 => "rock",
        _ => "boulder",
    }
}

/// a e i o u -> "vowel", other lowercase letters -> "consonant",
/// '0' to '9' -> "digit", anything else -> "other"
fn kind_of(c: char) -> &'static str {
    match c {
        'a' | 'e' | 'i' | 'o' | 'u' => "vowel",
        'a'..='z' => "consonant",
        '0'..='9' => "digit",
        _ => "other",
    }
}

fn main() {
    println!("{} {}", sort_rock(5), kind_of('e'));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn rocks() {
        assert_eq!(sort_rock(0), "dust");
        assert_eq!(sort_rock(1), "pebble");
        assert_eq!(sort_rock(2), "pebble");
        assert_eq!(sort_rock(3), "rock");
        assert_eq!(sort_rock(9), "rock");
        assert_eq!(sort_rock(10), "boulder");
        assert_eq!(sort_rock(500), "boulder");
    }

    #[test]
    fn characters() {
        assert_eq!(kind_of('a'), "vowel");
        assert_eq!(kind_of('u'), "vowel");
        assert_eq!(kind_of('b'), "consonant");
        assert_eq!(kind_of('z'), "consonant");
        assert_eq!(kind_of('0'), "digit");
        assert_eq!(kind_of('9'), "digit");
        assert_eq!(kind_of('A'), "other");
        assert_eq!(kind_of('?'), "other");
    }
}
'''
hints = [
    "兩個函式都只需要一個 `match`。用 `|` 在同一個分支列出多個值，並用 `..=` 表示範圍。",
    "把母音分支（`'a' | 'e' | 'i' | 'o' | 'u'`）放在 `'a'..='z'` 前面，因為會採用第一個符合的分支。",
    "```rust\nmatch weight {\n    0 => \"dust\",\n    1 | 2 => \"pebble\",\n    3..=9 => \"rock\",\n    _ => \"boulder\",\n}\n```",
]

