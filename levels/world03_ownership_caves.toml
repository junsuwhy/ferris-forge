在 C 中，你得記得自行呼叫 `free()` 釋放未回傳的值，否則就會洩漏。在 Rust 中，未回傳的值會在結尾的 `}` 自動清理。
'''
py_compare = '''
Python 的垃圾回收器會在*之後某個時間*釋放未使用的值；Rust 則會在明確的時間點，也就是擁有者的作用域結束時釋放。
'''
check = "tests"
starter = '''
fn longer(a: String, b: String) -> String {
    todo!()
}

fn main() {
