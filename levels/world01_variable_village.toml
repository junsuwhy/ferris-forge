id = 1
name = "變數村莊"
blurb = "值的家園：let、mut、遮蔽、數值型別、元組與陣列。"

[[level]]
id = "1.1"
title = "刻在石頭上"
kind = "fix"
book = ["3.1"]
xp = 30
goal = "修正程式，讓它成功編譯並印出：Gold: 15"
lesson = '''
在 Rust 中，變數**預設不可變**。設定值之後就不能再修改：

```rust
let x = 5;
x = 6;        // error[E0384]: x is immutable
```

若要允許修改，請加上 **`mut`**：

```rust
let mut x = 5;
x = 6;        // works now
```

為什麼要這樣設計？多數值都不會改變時，會變動的值就更醒目，編譯器也能幫忙抓出意外修改。
'''
c_compare = '''
C 剛好相反：除非寫上 `const`，否則變數都能修改。Rust 的 `let` 類似 C 的 `const`，`let mut` 則類似一般的 C 變數。
'''
py_compare = '''
Python 隨時都能讓名稱改指向其他值；Rust 則要求你事先標明哪些變數會改變。
'''
check = "output"
expected_output = "Gold: 15"
starter = '''
fn main() {
    let gold = 10;
    gold = gold + 5;
    println!("Gold: {}", gold);
}
'''
solution = '''
fn main() {
    let mut gold = 10;
    gold += 5;
    println!("Gold: {}", gold);
}
'''
hints = [
    "編譯器提到一個*不可變*變數。是哪個變數正在被修改？",
    "變數預設不可變。只要在第 2 行加上一個關鍵字，`gold` 就能修改。",
    "在第 2 行寫上 `let mut gold = 10;`。",
]

[[level]]
id = "1.2"
title = "村莊裡的變數遮蔽"
kind = "predict"
book = ["3.1"]
xp = 20
goal = "這段程式會印出什麼？"
lesson = '''
**變數遮蔽（shadowing）**：再次使用 `let`，就能宣告一個同名的*新*變數。新變數會遮住舊變數。在 `{ }` 區塊內建立的遮蔽，只會持續到該區塊結束。

這和 `mut` 不同：遮蔽會建立全新的變數，甚至可以換成不同型別。
'''
starter = '''
fn main() {
    let x = 5;
    let x = x + 1;
    {
        let x = x * 2;
        println!("inner: {}", x);
    }
    println!("outer: {}", x);
}
'''
choices = [
    "內層：12／外層：12",
    "內層：12／外層：6",
    "無法編譯：x 是不可變變數",
    "內層：10／外層：5",
]
answer = 1
expected_output = '''
inner: 12
outer: 6
'''
explanation = "`let x = x + 1` 建立了新的 `x`（值為 6）。區塊內又建立一個新 `x`，值為 12；但它在 `}` 處就結束了，因此外層的 `x` 仍是 6。程式沒有修改任何變數，所以不需要 `mut`。"

[[level]]
id = "1.3"
title = "蘋果與零錢"
kind = "fix"
book = ["3.2"]
xp = 30
goal = "讓程式印出：Total: 3.5"
lesson = '''
Rust 提供明確的數值型別，你可以依需求選擇大小：

| 型別 | 對應的 C 型別 | 可表示的值 |
|---|---|---|
| `i32` | `int32_t` | 整數，約正負 20 億（預設型別） |
| `u8` | `uint8_t` | 0 到 255 |
| `i64`, `u64` | `int64_t`, `uint64_t` | 範圍更大的整數 |
| `f64` | `double` | 小數（預設型別） |

Rust **不會自動轉換數值型別**。若要混用不同型別，請用 **`as`** 明確轉型：

```rust
let n: i32 = 7;
let half = n as f64 / 2.0;   // 3.5
```
'''
c_compare = '''
在 C 中，`7 * 0.5` 會悄悄把 `int` 轉成 `double`。這很方便，卻也是常見錯誤來源（例如整數除法，或負數變成很大的無號數）。Rust 要求你明確寫出轉型。
'''
py_compare = '''
Python 可以直接混用 `int` 和 `float`；Rust 不行。`i32` 乘上 `f64` 會造成編譯錯誤，必須先轉換其中一個型別。
'''
check = "output"
expected_output = "Total: 3.5"
starter = '''
fn main() {
    let apples: i32 = 7;
    let price: f64 = 0.5;
    let total = apples * price;
    println!("Total: {}", total);
}
'''
solution = '''
fn main() {
    let apples: i32 = 7;
    let price: f64 = 0.5;
    let total = apples as f64 * price;
    println!("Total: {}", total);
}
'''
hints = [
    "錯誤訊息指出 `i32` 不能乘上 `f64`。C 會怎麼處理？Rust 又要求你怎麼做？",
    "相乘前先把 `apples` 轉成 `f64`。Rust 有一個專門轉換數值型別的關鍵字。",
    "`let total = apples as f64 * price;`",
]

[[level]]
id = "1.4"
title = "溢位之井"
kind = "predict"
book = ["3.2"]
xp = 20
goal = "u8 的範圍是 0 到 255。這段程式會印出什麼？"
lesson = '''
數值超出型別範圍時會發生什麼事？

- 使用一般的 `+` 時，**偵錯**建置會停止程式（發生 *panic*），而不是悄悄算出錯誤結果。
- 如果你確實*想要*數值環繞回起點，可以使用 **`wrapping_add`** 這類方法明確指定。
- 此外還有 `checked_add` 和 `saturating_add`，之後會再介紹。
'''
c_compare = '''
在 C 中，無號整數溢位會悄悄環繞；*有號*整數溢位則屬於未定義行為。Rust 要你明確選擇處理方式。
'''
py_compare = '''
Python 的整數不會溢位，只會持續變大。Rust 的定長整數速度較快，但有範圍限制。
'''
starter = '''
fn main() {
    let level: u8 = 255;
    let next = level.wrapping_add(1);
    println!("{}", next);
}
'''
choices = [
    "256",
    "0",
    "發生 panic：加法溢位",
    "無法編譯：256 超出 u8 範圍",
]
answer = 1
expected_output = "0"
explanation = "`wrapping_add` 會刻意讓數值環繞：在 `u8` 中，255 + 1 會回到 0。若改用一般的 `level + 1`，偵錯建置則會發生 panic。"

[[level]]
id = "1.5"
title = "拆開推車裡的元組"
kind = "fill"
book = ["3.2"]
xp = 30
goal = "解構元組，讓程式印出：x = 3, y = 7"
lesson = '''
**元組（tuple）**會把固定數量的值組在一起，而且值可以是不同型別：

```rust
let crab = ("Ferris", 9, true);
println!("{}", crab.0);        // Ferris
```

你可以用一個 `let` **解構（destructure）**元組，分別建立多個變數：

```rust
let (name, age, happy) = crab;
```
'''
c_compare = '''
就像不必事先宣告的匿名 `struct`。可用位置存取欄位：`.0`、`.1`⋯⋯
'''
py_compare = '''
和 Python 的元組解包 `x, y = point` 一樣；Rust 只需要加上括號：`let (x, y) = point;`
'''
check = "output"
expected_output = "x = 3, y = 7"
starter = '''
fn main() {
    let point = (3, 7);

    // TODO：用一個 let 陳述式將 `point` 解構成 `x` 和 `y``

    println!("x = {}, y = {}", x, y);
}
'''
solution = '''
fn main() {
    let point = (3, 7);

    let (x, y) = point;

    println!("x = {}, y = {}", x, y);
}
'''
hints = [
    "編譯器找不到 `x` 或 `y`。你需要從 `point` 建立這兩個變數。",
    "`let` 左側可以使用符合元組結構的*模式（pattern）*。",
    "`let (x, y) = point;`",
]

[[level]]
id = "1.6"
title = "陣列索引越界"
kind = "fix"
book = ["3.2"]
xp = 30
goal = '''讓程式印出第一筆、最後一筆分數和筆數：
First: 90
Last: 77
Count: 3'''
lesson = '''
**陣列（array）**長度固定，而且每個元素的型別都相同：

```rust
let scores = [90, 85, 77];       // type: [i32; 3]
let first = scores[0];
let n = scores.len();            // 3
```

索引從 0 開始。Rust **會檢查每個索引**：錯誤索引可能在編譯時就被發現（像這裡），或讓程式安全停止，絕不會讀取任意記憶體。
'''
c_compare = '''
在 C 中，對只有 3 個元素的陣列存取 `scores[3]`，可能讀到後方任意記憶體。這是未定義行為，也是常見的安全漏洞；Rust 會阻止這種情況。
'''
py_compare = '''
類似 Python 的 `IndexError`，但 Rust 常能在程式執行前就發現問題。不過 Rust 陣列無法增長；要使用可增長的清單，可以用 `Vec`（很快就會學到！）。
'''
check = "output"
expected_output = '''
First: 90
Last: 77
Count: 3
'''
starter = '''
fn main() {
    let scores = [90, 85, 77];
    println!("First: {}", scores[0]);
    println!("Last: {}", scores[3]);
    println!("Count: {}", scores.length());
}
'''
solution = '''
fn main() {
    let scores = [90, 85, 77];
    println!("First: {}", scores[0]);
    println!("Last: {}", scores[scores.len() - 1]);
    println!("Count: {}", scores.len());
}
'''
hints = [
    "這裡有兩個問題：一個索引錯誤，以及一個方法名稱錯誤。仔細看兩則錯誤訊息。",
    "索引從 0 開始，所以有 3 個元素的陣列，最後一個索引是 2。Rust 查詢長度的方法名稱也比 `length` 短。",
    "使用 `scores[2]`（或 `scores[scores.len() - 1]`），並呼叫 `scores.len()`。",
]

[[level]]
id = "1.7"
title = "戴上 Debug 護目鏡"
kind = "predict"
book = ["3.2"]
xp = 20
goal = "這段程式會印出什麼？"
lesson = '''
`{}` 用於**易讀、給使用者看的**輸出。許多型別（例如元組和陣列）沒有單一的易讀格式，因此 Rust 提供 **`{:?}`**（*Debug* 格式）供程式設計者檢視。
'''
starter = '''
fn main() {
    let loot = (1, "two", 3.5);
    println!("{:?}", loot);
}
'''
choices = [
    "(1, two, 3.5)",
    "(1, \"two\", 3.5)",
    "It doesn't compile: tuples can't be printed",
    "1 two 3.5",
]
answer = 1
expected_output = '(1, "two", 3.5)'
explanation = "`{:?}` 會以類似程式碼的形式顯示值，因此字串會保留引號。若改用一般的 `{}`，這行就無法編譯，因為元組沒有「易讀」格式。"

[[level]]
id = "1.const"
title = "刻鑿於石"
kind = "fix"
book = ["3.1"]
xp = 30
goal = '''讓程式印出：
Max health: 100
Double: 200'''
lesson = '''
**常數（constant）**是永遠不變的值，在程式執行前就已確定：

```rust
const MAX_SPEED: u32 = 120;
```

常數的規則：
- 使用 `SCREAMING_SNAKE_CASE` 命名
- **必須指定型別**，Rust 不會代你推斷
- 可以宣告在函式外，讓整個程式都能使用
- 絕不能加上 `mut`
'''
c_compare = '''
類似 `#define MAX_SPEED 120`，但有型別並會經過檢查；也類似全域的 `const int`。
'''
py_compare = '''
Python 只有命名慣例（`MAX_SPEED = 120`）；Rust 的 `const` 則真的不能改變。
'''
check = "output"
expected_output = '''
Max health: 100
Double: 200
'''
starter = '''
const MAX_HEALTH = 100;

fn main() {
    println!("Max health: {}", MAX_HEALTH);
    println!("Double: {}", MAX_HEALTH * 2);
}
'''
solution = '''
const MAX_HEALTH: u32 = 100;

fn main() {
    println!("Max health: {}", MAX_HEALTH);
    println!("Double: {}", MAX_HEALTH * 2);
}
'''
hints = [
    "編譯器指出這個常數少了某項資訊。常數的規則比 `let` 更嚴格。",
    "常數必須標示型別，格式如下：`const NAME: Type = value;`。",
    "`const MAX_HEALTH: u32 = 100;`",
]

[[level]]
id = "1.charbool"
title = "字母與開關"
kind = "predict"
book = ["3.2"]
xp = 20
goal = "這段程式會印出什麼？"
lesson = '''
再認識兩種簡單型別：

- **`bool`**：`true` 或 `false`，就像電燈開關
- **`char`**：一個 Unicode 字元，使用單引號表示： `'a'`, `'Z'`, `'🦀'`

`std::mem::size_of::<T>()` 可以查詢型別使用多少位元組。
'''
c_compare = '''
C 的 `char` 是一個位元組；Rust 的 `char` 則能表示完整的 Unicode 純量值，因此可以存放任何文字或表情符號。
'''
py_compare = '''
Python 沒有獨立的字元型別（「char」只是只有一個字元的字串）；Rust 的 `char` 則是獨立型別。
'''
starter = '''
fn main() {
    let crab = '🦀';
    let is_happy = true;
    println!("{} {}", crab, is_happy);
    println!("{}", std::mem::size_of::<char>());
}
'''
choices = [
    "🦀 true / 1",
    "🦀 true / 4",
    "It doesn't compile: a char can't hold an emoji",
    "🦀 1 / 4",
]
answer = 1
expected_output = '''
🦀 true
4
'''
explanation = "Rust 的 `char` 可以存放任何 Unicode 字元（包括 🦀），因此占用 4 個位元組。`bool` 會印出 `true`。"

[[level]]
id = "1.8"
title = "頭目戰：村莊溫度計"
kind = "boss"
book = ["3.2"]
xp = 60
goal = '''將三個華氏溫度轉為攝氏，並完全照以下格式印出：
32.0F = 0.0C
212.0F = 100.0C
98.6F = 37.0C'''
lesson = '''
**頭目戰！**運用你在變數村莊學到的知識。

換算公式： `celsius = (fahrenheit - 32.0) * 5.0 / 9.0`

若要讓數字固定顯示一位小數，請使用 **`{:.1}`**：

```rust
println!("{:.1}", 2.0 / 3.0);   // 0.7
```

記得使用陣列和索引，也別混用整數與浮點數！
'''
c_compare = '''
`{:.1}` 類似 `printf("%.1f", x)`。
'''
py_compare = '''
`{:.1}` 的作用和 Python 的 `f"{x:.1f}"` 相同。
'''
check = "output"
expected_output = '''
32.0F = 0.0C
212.0F = 100.0C
98.6F = 37.0C
'''
starter = '''
fn main() {
    let readings_f: [f64; 3] = [32.0, 212.0, 98.6];

    // TODO: convert each reading with (f - 32.0) * 5.0 / 9.0
    // TODO: print each line like:  32.0F = 0.0C
}
'''
solution = '''
fn main() {
    let readings_f: [f64; 3] = [32.0, 212.0, 98.6];

    let c0 = (readings_f[0] - 32.0) * 5.0 / 9.0;
    let c1 = (readings_f[1] - 32.0) * 5.0 / 9.0;
    let c2 = (readings_f[2] - 32.0) * 5.0 / 9.0;

    println!("{:.1}F = {:.1}C", readings_f[0], c0);
    println!("{:.1}F = {:.1}C", readings_f[1], c1);
    println!("{:.1}F = {:.1}C", readings_f[2], c2);
}
'''
hints = [
    "先處理一筆溫度。要如何從陣列取出第一個元素？",
    "使用公式計算每個攝氏溫度，並使用 `f64` 常值（`32.0`，不是 `32`）；接著用 `{:.1}` 印出兩個數字。",
    "`let c0 = (readings_f[0] - 32.0) * 5.0 / 9.0;` then `println!(\"{:.1}F = {:.1}C\", readings_f[0], c0);`, and the same for indexes 1 and 2.",
]
