[[level]]
id = "8.3"
title = "危險操作：unwrap"
kind = "predict"
book = ["9.2"]
xp = 25
goal = "執行這段程式會發生什麼事？"
lesson = '''
處理 `Result`（和 `Option`）的簡便方法：

- `.unwrap()`：若為 `Ok` 就取得值，否則觸發 **panic**
- `.expect("message")`：作用相同，但 panic 時會顯示自訂訊息（更方便除錯）
- `.unwrap_or(default)`：取得值，若失敗則使用預設值，不會 panic

快速實驗、測試，或你*確定不會失敗*時，可以使用 `unwrap` 和 `expect`。正式程式碼則建議處理錯誤。
'''
c_compare = '''
`expect` 類似 `assert(ptr != NULL && "ship needs fuel")`，但一定會執行檢查。
'''
py_compare = '''
對 `Err` 呼叫 `unwrap()`，就像任由例外讓程式崩潰。
'''
starter = '''
fn main() {
    let a: Result<u32, String> = Ok(3);
    let b: Result<u32, String> = Err(String::from("no fuel"));
    let c: Result<u32, String> = Err(String::from("no fuel"));
    println!("{}", a.unwrap());
    println!("{}", b.unwrap_or(0));
    println!("{}", c.expect("ship needs fuel"));
}
'''
choices = [
    "3 / 0 / 0",
    "印出 3 和 0，接著顯示 ship needs fuel: \"no fuel\" 並 panic",
    "無法編譯",
    "印出 3，接著崩潰",
]
answer = 1
expected_output = '''
3
0
'''
explanation = "`a.unwrap()` 取得 3，`b.unwrap_or(0)` 使用預設值 0，而 `c.expect(...)` 會以自訂訊息加上錯誤內容觸發 panic：`ship needs fuel: \"no fuel\"`。"

[[level]]
id = "8.4"
title = "用 ? 傳遞錯誤"
kind = "fill"
book = ["9.2"]
xp = 50
goal = "使用 `?` 向上傳遞錯誤，撰寫 `parse_pair`（輸入 \"3,4\"、回傳 (3, 4)）和 `first_upper`。"
lesson = '''
每種錯誤都寫一個 `match` 會很冗長。**`?` 運算子**可以替你處理：

```rust
fn read_number(text: &str) -> Result<i32, std::num::ParseIntError> {
    let n = text.parse::<i32>()?;   // 若為 Err，立刻回傳該錯誤
    Ok(n * 2)
}
```

`?` 也能用於 `Option`：遇到 `None` 時，函式會立刻回傳 `None`。

只有回傳 `Result`（或 `Option`）的函式才能使用 `?`。`main` 也可以這樣寫：`fn main() -> Result<(), Box<dyn std::error::Error>>`。
'''
c_compare = '''
類似每次呼叫後都寫 `if (err) return err;` 的 C 模式，只是濃縮成一個字元。
'''
py_compare = '''
Python 的例外會自動向上傳遞；`?` 則是明確可見的版本。
'''
check = "tests"
starter = '''
use std::num::ParseIntError;

fn parse_pair(text: &str) -> Result<(i32, i32), ParseIntError> {
    // "3,4" -> Ok((3, 4))。每次解析都使用 ?。
    let mut parts = text.split(',');
    let left = parts.next().unwrap_or("").trim();
    let right = parts.next().unwrap_or("").trim();
    todo!()
}

fn first_upper(s: &str) -> Option<char> {
    // 回傳第一個大寫字元；字串為空時回傳 None。使用 ?。
    todo!()
}

fn main() {
    println!("{:?} {:?}", parse_pair("3,4"), first_upper("rust"));
}
'''
solution = '''
use std::num::ParseIntError;

fn parse_pair(text: &str) -> Result<(i32, i32), ParseIntError> {
    // "3,4" -> Ok((3, 4))。每次解析都使用 ?。
    let mut parts = text.split(',');
    let left = parts.next().unwrap_or("").trim();
    let right = parts.next().unwrap_or("").trim();
    let a = left.parse::<i32>()?;
    let b = right.parse::<i32>()?;
    Ok((a, b))
}

fn first_upper(s: &str) -> Option<char> {
    // 回傳第一個大寫字元；字串為空時回傳 None。使用 ?。
    let c = s.chars().next()?;
    Some(c.to_ascii_uppercase())
}

fn main() {
    println!("{:?} {:?}", parse_pair("3,4"), first_upper("rust"));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn good_pair() {
        assert_eq!(parse_pair("3,4"), Ok((3, 4)));
        assert_eq!(parse_pair(" -1 , 20 "), Ok((-1, 20)));
    }

    #[test]
    fn bad_pair() {
        assert!(parse_pair("3,x").is_err());
        assert!(parse_pair("only").is_err());
    }

    #[test]
    fn first_letter() {
        assert_eq!(first_upper("rust"), Some('R'));
        assert_eq!(first_upper(""), None);
    }
}
'''
hints = [
    "用 `.parse::<i32>()` 解析 `left` 和 `right`，各自在後面加上 `?`，再用 `Ok` 包住兩個數字。",
    "`parse_pair` 最後回傳 `Ok((a, b))`。`first_upper` 則先寫 `let c = s.chars().next()?;`，再回傳 `Some(...)`。",
    "```rust\nlet a = left.parse::<i32>()?;\nlet b = right.parse::<i32>()?;\nOk((a, b))\n```\n另外\n```rust\nlet c = s.chars().next()?;\nSome(c.to_ascii_uppercase())\n```",
]

[[level]]
id = "8.5"
title = "崩潰還是處理？"
kind = "fill"
book = ["9.3"]
