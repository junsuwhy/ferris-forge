[[level]]
id = "7.5"
title = "為什麼不能寫 s[0]？"
kind = "predict"
book = ["8.2"]
xp = 25
goal = "這段程式會印出什麼？"
lesson = '''
Rust 字串使用 **UTF-8** 編碼。一般英文字母各占 1 個位元組，但 `é`、`ñ` 或 `你` 等字元會占 2 到 4 個位元組。

- `s.len()` 計算**位元組數**
- `s.chars().count()` 計算**字元數**

這就是 Rust 不允許寫 `s[0]` 的原因：「第一個位元組」可能只是半個字！請用 `s.chars()` 逐字走訪，或只在確定安全的位元組位置使用切片。
'''
c_compare = '''
`strlen` 也會計算位元組，而不是字元；但 C 仍允許你索引到多位元組字元的中間。
'''
py_compare = '''
Python 的 `len("héllo")` 是 5，因為 Python 計算字元數；Rust 的 `.len()` 則計算位元組數。
'''
starter = '''
fn main() {
    let s = String::from("héllo");
    println!("{} {}", s.len(), s.chars().count());
}
'''
choices = ["5 5", "6 5", "5 6", "無法編譯：不允許使用 é"]
answer = 1
expected_output = "6 5"
explanation = "在 UTF-8 中，`é` 占 2 個位元組，因此這個字串長 6 個位元組，但只有 5 個字元。"

