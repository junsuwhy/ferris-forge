[[level]]
id = "4.2"
title = "三把鑰匙：讀取、寫入、擁有"
kind = "predict"
book = ["4.2"]
xp = 25
goal = "這段程式能編譯嗎？如果可以，會印出什麼？"
lesson = '''
Brown 版《Rust 程式設計語言》用**權限**解釋借用。每個變數最多持有三把鑰匙：

- **R**ead（讀取）：可以讀取值
- **W**rite（寫入）：可以修改值
- **O**wn（擁有）：可以移動或丟棄值

`let mut v = vec![1, 2, 3];` 會讓 `v` 擁有三把鑰匙：**R W O**。

使用 `let first = &v[0];` 借用時，直到最後一次使用 `first` 為止，`v` 都會**借出 W 和 O 鑰匙**。借用期間只能讀取 `v`。
'''
c_compare = '''
在 C 中，執行 `int *first = &v[0];` 後再擴充陣列，可能會把陣列搬到新的記憶體位置，讓 `first` 變成懸空指標。Rust 的權限檢查會在程式執行前抓出問題。
'''
py_compare = '''
在 Python 中，即使你持有某個項目的參照，清單仍可被修改，沒有任何限制。Rust 的權限檢查是為了記憶體安全，不只是程式風格。
'''
starter = '''
fn main() {
    let mut v = vec![1, 2, 3];
    let first = &v[0];
    v.push(4);
    println!("{}", first);
}
'''
choices = [
    "1",
    "無法編譯：first 仍在借用 v，因此不能修改 v",
    "程式崩潰：first 指向已釋放的記憶體",
    "4",
]
answer = 1
compile_fails = true
explanation = "`first` 借用了 `v`，因此直到第 5 行最後一次使用 `first` 前，`v` 都沒有寫入權限。`v.push(4)` 需要寫入權限，所以會產生錯誤 E0502。推入項目可能重新配置向量，讓 `first` 變成懸空指標；Rust 正是要防止這種錯誤。"

