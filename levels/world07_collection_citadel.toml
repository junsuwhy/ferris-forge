[[level]]
id = "7.9"
title = "頭目戰：成績簿"
kind = "boss"
book = ["8.1", "8.2", "8.3"]
xp = 100
goal = '''建立 `Gradebook`：新增分數、計算每位學生的平均分、
找出成績最佳的學生，並按字母順序列出姓名。'''
lesson = '''
**頭目戰！**使用 `HashMap<String, Vec<u32>>`：每位學生的姓名對應一份分數清單。

需要撰寫的方法：
- `add(name, score)`：將分數推入該學生的清單（若清單不存在就建立：`entry(...).or_insert_with(Vec::new)` 或 `or_default()`）
- `average(name) -> Option<f64>`：學生不存在時回傳 `None`
- `best_student() -> Option<String>`：回傳平均分最高者（若並列，回傳姓名字母順序較前者）
- `names() -> Vec<String>`：回傳排序後的所有姓名（`v.sort()`）

Map 不會保留順序，需要排序時請自行處理。
'''
c_compare = '''
在 C 中，管理可擴充陣列的 map 可能要寫上百行；這裡只要一個型別：`HashMap<String, Vec<u32>>`。
'''
py_compare = '''
類似存放分數的 `defaultdict(list)`。
'''
check = "tests"
starter = '''
use std::collections::HashMap;

struct Gradebook {
    scores: HashMap<String, Vec<u32>>,
}

impl Gradebook {
    fn new() -> Self {
        Gradebook { scores: HashMap::new() }
    }

    fn add(&mut self, name: &str, score: u32) {
        todo!()
    }

    fn average(&self, name: &str) -> Option<f64> {
        todo!()
    }

    fn best_student(&self) -> Option<String> {
        todo!()
    }

    fn names(&self) -> Vec<String> {
        todo!()
    }
}

fn main() {
    let mut book = Gradebook::new();
    book.add("Ferris", 90);
    book.add("Corro", 70);
    println!("{:?}", book.best_student());
