C 的 `char *` 欄位會讓人疑惑「到底誰負責釋放？」在 Rust 中，`String` 表示「由結構體釋放」，而 `&str` 表示「由其他人擁有」。
'''
py_compare = '''
在 Python 中不必思考這個問題；在 Rust 中，所有權會反映在型別上。
'''
