id = 0
name = "教學海灘"
blurb = "漂流上岸、認識 Ferris，並用 Rust 說出你的第一句話。"

[[level]]
id = "0.1"
title = "嗨，Ferris！"
kind = "fix"
book = ["1.2"]
xp = 20
goal = "讓程式完全照樣印出：Hello, Ferris!"
lesson = '''
歡迎來到鍛造坊！每個 Rust 程式都從 `fn main()` 開始執行，就像 C 的 `int main()`。

要輸出文字，Rust 使用 **`println!`**。驚嘆號很重要：它表示 `println!` 是一種**巨集（macro）**，會在編譯時替你產生程式碼。這樣 Rust 就能在編譯時檢查格式字串。

和 C 一樣，陳述式結尾要加分號 `;`。

按下**執行**（或 Ctrl+Enter）開始編譯。編譯器訊息是你的好幫手，記得從上往下讀！
'''
c_compare = '''
```c
#include <stdio.h>
int main(void) {
    printf("Hello, Ferris!\n");
    return 0;
}
```
Rust 不需要用 `#include` 匯入輸出功能，而且 `println!` 會自動幫你換行。
'''
py_compare = '''
```python
print("Hello, Ferris!")
```
在 Rust 中，`println!` 是巨集，所以名稱後面一定要加上 `!`。
'''
check = "output"
expected_output = "Hello, Ferris!"
starter = '''
fn main() {
    println("Hello, Ferris!");
}
'''
solution = '''
fn main() {
    println!("Hello, Ferris!");
}
'''
hints = [
    "編譯器說它預期看到*函式*，結果卻遇到別的東西。Rust 的輸出方式有什麼特別之處？",
    "`println!` 是**巨集（macro）**，呼叫時要在名稱後面加上 `!`。",
    "把第 2 行改成 `println!(\"Hello, Ferris!\");`。",
]

[[level]]
id = "0.2"
title = "填補空白"
kind = "fill"
book = ["1.2"]
xp = 25
goal = '''使用變數印出以下兩行：
Hello, Ferris!
Ferris is 9 years old.'''
lesson = '''
`println!` 可以使用 **`{}`** 佔位符插入值，並依序代入：

```rust
let food = "kelp";
println!("I love {}!", food);   // I love kelp!
```

也可以直接把變數名稱放進大括號：`println!("I love {food}!")`。

`let` 可以建立變數。Rust 通常會自動推斷變數的型別。
'''
c_compare = '''
類似 `printf("%s is %d years old\n", name, age);`，但 Rust 的 `{}` 可用於任何可輸出的型別。你不必選 `%d` 或 `%s`；型別不符時，Rust 會在**編譯時**回報錯誤，不會等到程式執行後才當掉。
'''
py_compare = '''
這和 Python 的 `print(f"{name} is {age} years old.")` 或 `"{} is {}".format(name, age)` 非常相似。
'''
check = "output"
expected_output = '''
Hello, Ferris!
Ferris is 9 years old.
'''
starter = '''
fn main() {
    let name = "Ferris";
    let age = 9;

    // TODO：使用 `name` 變數印出 "Hello, Ferris!"
    // TODO：使用 `name` 和 `age` 印出 "Ferris is 9 years old."
}
'''
solution = '''
fn main() {
    let name = "Ferris";
    let age = 9;

    println!("Hello, {}!", name);
    println!("{} is {} years old.", name, age);
}
'''
hints = [
    "你需要寫兩行 `println!`。要怎麼把變數放進文字*裡面*？",
    "用 `{}` 當佔位符，並在文字後面以逗號分隔傳入變數。",
    "接著寫 `println!(\"Hello, {}!\", name);` 和 `println!(\"{} is {} years old.\", name, age);`。",
]

[[level]]
id = "0.comments"
title = "沙灘上的註解"
kind = "fill"
book = ["3.4"]
xp = 20
goal = "在 `fn area` 正上方加上 `//` 註解，說明這個函式的用途。"
lesson = '''
註解是寫給人看的備註，編譯器會忽略它們。

```rust
// 這是一則註解，說明這段程式碼為什麼存在。
let speed = 3; // 註解也可以寫在程式碼行尾
```

好的註解會解釋**原因**，而不是描述做了什麼。在 `x + 1` 上方寫 `// 加 1` 對任何人都沒幫助！

Rust 還有 `///` **文件註解**，可以產生文件。你會在 Cargo 碼頭學到它們。
'''
c_compare = '''
和 C 一樣使用 `//` 和 `/* ... */`。Rust 程式設計師大多使用 `//`。
'''
py_compare = '''
Python 使用 `#`；Rust 則使用 `//`。
'''
check = "tests"
starter = '''
fn area(width: u32, height: u32) -> u32 {
    width * height
}

fn main() {
    println!("A 3 by 4 garden has area {}", area(3, 4));
}
'''
solution = '''
// 矩形面積：裡面可以放進多少個正方形地磚。
fn area(width: u32, height: u32) -> u32 {
    width * height
}

fn main() {
    println!("A 3 by 4 garden has area {}", area(3, 4));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    #[test]
    fn area_has_a_comment_above_it() {
        let src = include_str!("main.rs");
        let lines: Vec<&str> = src.lines().collect();
        let i = lines
            .iter()
            .position(|l| l.trim_start().starts_with("fn area("))
            .expect("keep the area function");
        assert!(
            i > 0 && lines[i - 1].trim_start().starts_with("//"),
            "put a // comment on the line right above fn area"
        );
    }

    #[test]
    fn area_still_works() {
        assert_eq!(super::area(3, 4), 12);
    }
}
'''
hints = [
    "註解以兩個斜線開頭。這則註解應該放在哪裡？",
    "在 `fn area(...)` 正上方新增一行，並以 `//` 開頭。",
    "在 `fn area` 上一行寫上 `// 矩形面積：寬乘以高。`。",
]

[[level]]
id = "0.3"
title = "水晶球預言"
kind = "predict"
book = ["1.2"]
xp = 15
goal = "讀讀這段程式碼。它會印出什麼？"
lesson = '''
**預測題**會訓練你在腦中讀懂 Rust 程式。仔細觀察並選擇答案，再執行程式確認你的想法。
'''
starter = '''
fn main() {
    let a = 2;
    let b = 3;
    println!("{} + {} = {}", a, b, a + b);
}
'''
choices = [
    "{} + {} = {}",
    "2 + 3 = 5",
    "a + b = 5",
    "無法編譯：不能在 println! 裡面做數學運算",
]
answer = 1
expected_output = "2 + 3 = 5"
explanation = "每個 `{}` 會依序由下一個值取代：先是 `a`，再來是 `b`，最後是 `a + b` 的結果。值清單中可以放任何運算式。"

[[level]]
id = "0.rustup"
title = "打開工具箱"
kind = "quiz"
book = ["1.1"]
xp = 15
goal = "哪個工具可以安裝 Rust 並保持更新？"
lesson = '''
Rust 附有一組實用的小工具：

| 工具 | 用途 |
|---|---|
| `rustup` | 安裝與更新 Rust（`rustup update`） |
| `rustc` | 編譯器：把 `.rs` 檔案編譯成程式 |
| `cargo` | 建置與執行專案，並下載程式庫 |

安裝一次 `rustup`，就能取得另外兩個工具。執行 `rustc --version` 可以查看目前安裝的 Rust 版本。
'''
c_compare = '''
`rustc` 類似 `gcc` 或 `clang`。`rustup` 則像是專門管理編譯器的套件管理工具，讓你不必和系統套件互相衝突。
'''
py_compare = '''
`rustup` 有點像管理 Python 版本的 `pyenv`；`cargo` 則把 `pip` 和專案管理工具的功能結合在一起。
'''
choices = [
    "rustc",
    "cargo",
    "rustup",
    "rustfmt",
]
answer = 2
explanation = "`rustup` 負責安裝與更新整套工具鏈；`rustc` 負責編譯，`cargo` 負責管理專案，而 `rustfmt` 會整理程式碼格式。"

[[level]]
id = "0.cargo"
title = "Cargo，可靠的貨車"
kind = "quiz"
book = ["1.3"]
xp = 15
goal = "`cargo run` 會做什麼？"
lesson = '''
正式的 Rust 專案會使用 **Cargo**：

```text
$ cargo new hello_cargo     # 建立專案資料夾
$ cd hello_cargo
$ cargo run                 # 先建置，再執行
```

新專案會包含：
- `Cargo.toml`：專案名稱、版本與相依套件
- `src/main.rs`：你的程式碼

其他實用指令：
- `cargo build`：編譯到 `target/debug/`
- `cargo check`：只檢查能否編譯（速度很快！）
- `cargo build --release`：建立經過最佳化、執行速度較快的版本

在這款遊戲中，真正的編譯器會在背景執行，所以你只要按下 ▶ 執行即可。
'''
c_compare = '''
Cargo 同時取代 Makefile *和* 套件管理工具，不必再手動撰寫建置指令稿。
'''
py_compare = '''
類似 `python main.py`，但 Cargo 會先編譯程式。你可以把 `Cargo.toml` 想成 `pyproject.toml`。
'''
starter = '''
$ cargo new hello_cargo
$ cd hello_cargo
$ cargo run
'''
choices = [
    "只編譯程式",
    "必要時先編譯程式，接著執行",
    "建立新專案",
    "將專案上傳至 crates.io",
]
answer = 1
explanation = "`cargo run` 會在有變更時重新建置，然後執行程式。`cargo build` 只會編譯，而 `cargo new` 會建立專案。"

[[level]]
id = "0.4"
title = "讀懂編譯器"
kind = "fix"
book = ["1.2"]
xp = 25
goal = '''修正所有錯誤，讓程式印出：
Washed up on Tutorial Beach.
Next stop: Variable Village!'''
lesson = '''
Rust 編譯器以**清楚實用的錯誤訊息**聞名。每則訊息都包含：

- `error[E0xxx]`：可以查詢的錯誤代碼（遊戲中的錯誤手冊 📖 有整理）
- `-->`：檔案位置、**行號**與欄號
- 通常還有 `help:` 行，會**建議修正方式**

這段程式有兩個不同的錯誤。先修正第一個錯誤，再執行一次並繼續修正下一個。這就是使用 Rust 時常見的除錯步驟。
'''
c_compare = '''
C 編譯器可能會接受拼錯的函式名稱，直到*連結*階段才失敗，並顯示令人困惑的訊息。Rust 會在開始建置前先檢查名稱。
'''
py_compare = '''
Python 只有在那一行*執行時*才會發現 `printn` 之類的拼字錯誤。Rust 則會在程式開始執行前就找出問題。
'''
check = "output"
expected_output = '''
Washed up on Tutorial Beach.
Next stop: Variable Village!
'''
starter = '''
fn main() {
    let place = "Tutorial Beach";
    printn!("Washed up on {}.", place);
    println!("Next stop: Variable Village!")
    let done = true;
}
'''
solution = '''
fn main() {
    let place = "Tutorial Beach";
    println!("Washed up on {}.", place);
    println!("Next stop: Variable Village!");
    let _done = true;
}
'''
hints = [
    "看看編譯器輸出中的 `help:` 行。Rust 常會直接建議修正方式！",
    "有一個巨集名稱拼錯了，還有一行少了結尾符號。",
    "第 3 行應該使用 `println!`，第 4 行結尾則要加上 `;`。",
]
