1. **從集合中移出值。**`let x = v[0];` 試圖將 `String` 從 Vec 中取出。應改為借用：`&v[0]`。
2. **別名加上修改。**持有 Vec 內部參照時又推入新值。先複製值出來（數字可用 `*` 複製）。
3. **其實不是錯誤！**借用元組的一個欄位時，修改*另一個*欄位是允許的。Rust 會分別追蹤各個欄位。

