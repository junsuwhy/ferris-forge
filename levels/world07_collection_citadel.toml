xp = 40
goal = "撰寫 `backpack`（建立含三個項目的 Vec）和 `safe_get`（讀取項目且不會崩潰）。"
lesson = '''
**`Vec<T>`** 是可以擴充的清單：

```rust
let mut v: Vec<i32> = Vec::new();
v.push(5);
v.push(6);
let w = vec![1, 2, 3];    // vec! 巨集可直接建立含有項目的 Vec
```

讀取第 `i` 個項目的兩種方式：
- `v[i]` 會取得項目，但索引超出範圍時會**崩潰**
- `v.get(i)` 會回傳 **`Option<&T>`**：`Some(&item)` 或 `None`
'''
c_compare = '''
`Vec` 是可擴充的陣列，包含指標、長度和容量，類似使用 `realloc` 撰寫的動態陣列。它會自行釋放記憶體。
'''
py_compare = '''
類似 Python 的 `list`，但所有項目型別都相同；使用 `.get(i)` 可以避免 `IndexError`。
'''
check = "tests"
starter = '''
fn backpack() -> Vec<String> {
    // TODO：建立空 Vec，依序推入 "rope"、"lamp" 和 "map"，再回傳 Vec
    todo!()
}

fn safe_get(items: &Vec<String>, i: usize) -> String {
    // TODO：使用 items.get(i)：回傳項目副本；索引超出範圍時回傳 "nothing"
    todo!()
}

fn main() {
    let bag = backpack();
    println!("{} / {}", safe_get(&bag, 1), safe_get(&bag, 9));
}
'''
solution = '''
fn backpack() -> Vec<String> {
    let mut bag = Vec::new();
    bag.push(String::from("rope"));
    bag.push(String::from("lamp"));
    bag.push(String::from("map"));
    bag
}

fn safe_get(items: &Vec<String>, i: usize) -> String {
    match items.get(i) {
        Some(item) => item.clone(),
        None => String::from("nothing"),
    }
}

fn main() {
    let bag = backpack();
    println!("{} / {}", safe_get(&bag, 1), safe_get(&bag, 9));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn packs_three_things() {
        assert_eq!(backpack(), vec!["rope", "lamp", "map"]);
    }

    #[test]
    fn safe_get_never_crashes() {
        let bag = backpack();
        assert_eq!(safe_get(&bag, 0), "rope");
        assert_eq!(safe_get(&bag, 2), "map");
        assert_eq!(safe_get(&bag, 3), "nothing");
    }
}
'''
hints = [
    "`backpack`：先寫 `let mut bag = Vec::new();`。`safe_get`：`items.get(i)` 會回傳 `Option`，因此要用 `match` 處理。",
    "用 `bag.push(String::from(\"rope\"))` 加入每個物品。`safe_get` 中，`Some(item)` 回傳 `item.clone()`，`None` 回傳 `String::from(\"nothing\")`。",
    "```rust\nfn safe_get(items: &Vec<String>, i: usize) -> String {\n    match items.get(i) {\n        Some(item) => item.clone(),\n        None => String::from(\"nothing\"),\n    }\n}\n```",
]

[[level]]
id = "7.2"
title = "它移動時別抓著它"
kind = "fix"
book = ["8.1"]
xp = 40
goal = "修正程式，讓它印出：first: 1, len: 4"
lesson = '''
為什麼推入項目時不能同時持有指向 Vec 內部的參照？

Vec 空間不足時，`push` 會將**所有**項目移到更大的記憶體區塊。指向舊區塊的參照就會指向已釋放的記憶體。因此只要還在使用 `&v[0]`，就不能修改 `v`。

通常可以先將值**複製**出來（數字實作了 `Copy`）、呼叫 `clone`，或先用完參照再推入新項目。
'''
c_compare = '''
這正是 C 中保留 `int *p = &arr[0]`、呼叫 `realloc` 後讓 `p` 懸空的錯誤。Rust 會在編譯時阻止它。
'''
py_compare = '''
Python 清單也會重新配置記憶體，但 Python 參照指向物件，而不是清單中的記憶體位置，因此不會發生這種問題。
'''
check = "output"
expected_output = "first: 1, len: 4"
starter = '''
fn main() {
    let mut v = vec![1, 2, 3];
    let first = &v[0];
    v.push(4);
    println!("first: {}, len: {}", first, v.len());
}
'''
solution = '''
fn main() {
    let mut v = vec![1, 2, 3];
    let first = v[0];
    v.push(4);
    println!("first: {}, len: {}", first, v.len());
}
'''
hints = [
    "`first` 借用了 `v` 的內容，而且在 `push` 之後還會繼續使用。",
    "複製一個數字很方便。這裡真的需要參照嗎？",
    "`let first = v[0];` 會複製出 1，因此 `v` 就能繼續修改。",
]

[[level]]
id = "7.3"
title = "沿著架子逐項走訪"
kind = "fill"
book = ["8.1"]
xp = 45
goal = "撰寫 `double_all`（修改每個項目）和 `total`（計算總和）。"
lesson = '''
走訪 Vec：

```rust
for x in &v {        // 讀取每個項目（x 是 &i32）
    println!("{x}");
}

for x in &mut v {    // 修改每個項目（x 是 &mut i32）
    *x += 1;         // * 會透過參照取得項目
}
```

Vec 中的項目型別必須相同，但該型別可以是**列舉**，因此一個清單仍能存放不同種類的資料。
'''
c_compare = '''
`for x in &mut v` 類似用指標走訪陣列並逐項寫入，但不可能超出範圍。
'''
py_compare = '''
Python 的 `for x in items: x *= 2` 不會修改清單。在 Rust 中，`for x in &mut v { *x *= 2 }` 就會修改。
'''
check = "tests"
starter = '''
fn double_all(v: &mut Vec<i32>) {
    todo!()
}

fn total(v: &Vec<i32>) -> i32 {
    todo!()
}

fn main() {
    let mut v = vec![1, 2, 3];
    double_all(&mut v);
    println!("{:?} total {}", v, total(&v));
}
'''
solution = '''
fn double_all(v: &mut Vec<i32>) {
    for x in v.iter_mut() {
        *x *= 2;
    }
}

fn total(v: &Vec<i32>) -> i32 {
    let mut sum = 0;
    for x in v {
        sum += x;
    }
    sum
}

fn main() {
    let mut v = vec![1, 2, 3];
    double_all(&mut v);
    println!("{:?} total {}", v, total(&v));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn doubles() {
        let mut v = vec![1, 2, 3];
        double_all(&mut v);
        assert_eq!(v, vec![2, 4, 6]);
    }

    #[test]
    fn totals() {
        assert_eq!(total(&vec![2, 4, 6]), 12);
        assert_eq!(total(&vec![]), 0);
    }
}
'''
hints = [
    "`double_all` 需要透過可變參照修改每個元素；`total` 則只需要讀取。",
    "在 `double_all` 中使用 `for x in v.iter_mut() { *x *= 2; }`。在 `total` 中逐步累加總和。",
    "```rust\nfn double_all(v: &mut Vec<i32>) { for x in v.iter_mut() { *x *= 2; } }\nfn total(v: &Vec<i32>) -> i32 { let mut sum = 0; for x in v { sum += x; } sum }\n```",
]

