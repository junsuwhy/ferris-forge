enum Result<T, E> {
    Ok(T),    // 成功，這裡是結果值
    Err(E),   // 失敗，這裡是錯誤原因
}
```

`Result<u32, String>` 並不是數字，所以必須先檢查裡面的結果：

```rust
match parse_level("7") {
    Ok(n) => println!("got {n}"),
    Err(e) => println!("oops: {e}"),
}
```
'''
