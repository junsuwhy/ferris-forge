有些錯誤無法復原，此時 Rust 程式會發生 **panic**：印出訊息後停止，並在結束過程中清理記憶體（稱為*展開*）。

你可以使用 `panic!("message")` 主動觸發 panic。有些操作也可能觸發 panic，例如讀取超出 Vec 結尾的位置。

設定環境變數 `RUST_BACKTRACE=1` 執行程式，就能查看導致 panic 的函式呼叫鏈。
'''
