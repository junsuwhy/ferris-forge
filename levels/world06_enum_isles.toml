**`match`** 會由上而下比對值與模式，並執行第一個符合的分支：

```rust
match direction {
    Direction::North => println!("up"),
    Direction::South => println!("down"),
}
```

`match` 必須涵蓋**所有可能情況**：每個變體都要有對應分支，否則無法編譯。和 `if` 一樣，`match` 也是會產生值的運算式。
'''
c_compare = '''
類似不會貫穿執行、也不會漏掉情況的 `switch`。
'''
py_compare = '''
Python 3.10 的 `match` 看起來很相似，但 Rust 會在編譯時檢查是否涵蓋所有情況。
'''
