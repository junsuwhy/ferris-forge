goal = "撰寫 `count_words`：計算每個單字出現幾次。"
lesson = '''
依據舊值更新 map 的值很常見，因此 HashMap 提供了 **entry API**：

```rust
let count = map.entry(word).or_insert(0);  // 取得值；若不存在就插入 0
*count += 1;                               // count 是 &mut，因此要透過 * 修改
```

`entry(...).or_insert(...)` 會回傳 map 中該值的可變參照。
'''
c_compare = '''
在 C 中必須先查詢、不存在時再插入，最後更新：三個獨立步驟，也有三次出錯機會。
'''
py_compare = '''
類似 `counts[w] = counts.get(w, 0) + 1`，或 `collections.Counter`。
'''
check = "tests"
starter = '''
use std::collections::HashMap;

fn count_words(text: &str) -> HashMap<String, u32> {
    todo!()
}

fn main() {
    let counts = count_words("the crab saw the sea");
    println!("the: {}", counts["the"]);
}
'''
solution = '''
use std::collections::HashMap;

fn count_words(text: &str) -> HashMap<String, u32> {
    let mut counts = HashMap::new();
    for word in text.split_whitespace() {
        let count = counts.entry(word.to_string()).or_insert(0);
        *count += 1;
    }
    counts
}

fn main() {
    let counts = count_words("the crab saw the sea");
    println!("the: {}", counts["the"]);
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn counts_each_word() {
        let c = count_words("the crab saw the sea the end");
        assert_eq!(c["the"], 3);
        assert_eq!(c["crab"], 1);
        assert_eq!(c.len(), 5);
    }

    #[test]
    fn empty_text() {
        assert!(count_words("").is_empty());
    }
}
'''
hints = [
    "迴圈走訪 `text.split_whitespace()`，每遇到一個單字，就將它的計數加一。",
    "`let count = counts.entry(word.to_string()).or_insert(0); *count += 1;`",
    "```rust\nlet mut counts = HashMap::new();\nfor word in text.split_whitespace() {\n    let count = counts.entry(word.to_string()).or_insert(0);\n    *count += 1;\n}\ncounts\n```",
]

