```

規則：
- 忽略空白行和以 `#` 開頭的行。
- 沒有 `=` 的行會產生 `BadLine(line_number)`（行號從 1 開始）。
- `players` 必須是數字，否則回傳 `BadNumber(value)`。
- `music` 必須是 `on` 或 `off`，否則回傳 `BadBool(value)`。若未設定，預設為 `false`。
- 必須設定 `name` 和 `players`：`MissingKey("name")`／`MissingKey("players")`。
- 忽略未知的鍵。

可用的方法： `text.lines()`, `line.split_once('=')`, `.trim()`, `.parse::<u32>()`, and `opt.ok_or(error)?` 將不存在的 Option 轉成錯誤。要將一種錯誤轉成另一種，使用 `.map_err(|_| ConfigError::BadNumber(value.to_string()))?`.
'''
