]

[[level]]
id = "3.box"
title = "倉庫裡的寶藏"
kind = "predict"
book = ["4.1"]
xp = 25
goal = "這段程式能編譯嗎？如果可以，會印出什麼？"
lesson = '''
資料存放在哪裡？

- **堆疊**存放函式的區域變數，速度很快，函式回傳時就會清理。
- **堆積**像大型倉庫，適合存放需要延長生命週期或擴充的資料。

`Box::new(5)` 會把 5 放在堆積上，並在堆疊中保存指向它的**指標**。`Box` **擁有**那塊堆積空間，因此 `Box` 被丟棄時，空間也會釋放。

將一個 Box 指派給另一個變數時會發生什麼事？
'''
c_compare = '''
`Box::new(5)` 類似 `int *p = malloc(sizeof(int)); *p = 5;`，但 Rust 會替你呼叫一次 `free`。
'''
py_compare = '''
Python 的每個物件都存放在堆積上。Rust 讓你自行選擇，並明確標示擁有者。
'''
starter = '''
fn main() {
    let a = Box::new(5);
    let b = a;
    println!("{}", b);
    println!("{}", a);
}
'''
choices = [
    "5 / 5",
    "無法編譯：a 已移動到 b",
    "5 / 0",
    "程式會崩潰：Box 被釋放了兩次",
]
answer = 1
compile_fails = true
explanation = "`let b = a;` 會移動 `Box`：指標本身會複製，但 `a` 不再有效，因此使用它會產生錯誤 E0382。這就是 Rust 如何避免選項 D 所說的重複釋放。"

[[level]]
