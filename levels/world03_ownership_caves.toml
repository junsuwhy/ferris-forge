[[level]]
id = "3.9"
title = "頭目戰：洞窟物品欄"
kind = "boss"
book = ["4.1"]
xp = 90
goal = '''撰寫 `pick_up` 和 `count`，接著修正 `main` 中的所有權錯誤。
Ferris 會測試這兩個函式，而且 `main` 也必須能編譯。'''
lesson = '''
**頭目戰！**認識可動態增長的清單 **`Vec<T>`**（類似 Python 的 `list`，或會自行呼叫 `realloc` 的 C 陣列）：

```rust
let mut bag: Vec<String> = Vec::new();
bag.push(String::from("rope"));   // 現在由 Vec 擁有這個 String
let n = bag.len();
println!("{:?}", bag);            // ["rope"]
```

你的任務：
1. `pick_up(inventory, item)` 將 `item` 加入物品欄，再回傳物品欄。
2. `count(inventory)` 以元組回傳物品欄**和**它的長度。為什麼要回傳物品欄？因為你把它*移動*進函式了！
3. `main` 在某個值移動後仍繼續使用它。找出問題並修正。

注意到不斷傳入並交還所有權有多麻煩了嗎？這正是**借用**存在的原因。下一章就會介紹！🌉
'''
c_compare = '''
把 `String` 推入 `Vec` 時，指標會移到向量中。接著由向量負責釋放每個項目。在 C 中，你必須手動撰寫清理迴圈。
'''
py_compare = '''
`Vec<String>` 類似只能存放字串的 `list[str]`。與 Python 不同，`bag.push(item)` 會把 `item` *移動*到清單中。
'''
check = "tests"
starter = '''
fn pick_up(inventory: Vec<String>, item: String) -> Vec<String> {
    todo!()
}

fn count(inventory: Vec<String>) -> (Vec<String>, usize) {
    todo!()
}

fn main() {
    let mut inventory = Vec::new();
    let sword = String::from("sword");
    inventory = pick_up(inventory, sword);
    inventory = pick_up(inventory, String::from("shield"));
    let (inventory, n) = count(inventory);
    println!("Carrying {} items: {:?}", n, inventory);
    println!("My trusty {} gleams.", sword);
}
'''
solution = '''
fn pick_up(mut inventory: Vec<String>, item: String) -> Vec<String> {
    inventory.push(item);
    inventory
}

fn count(inventory: Vec<String>) -> (Vec<String>, usize) {
    let n = inventory.len();
    (inventory, n)
}

fn main() {
    let mut inventory = Vec::new();
    let sword = String::from("sword");
    inventory = pick_up(inventory, sword.clone());
    inventory = pick_up(inventory, String::from("shield"));
    let (inventory, n) = count(inventory);
    println!("Carrying {} items: {:?}", n, inventory);
    println!("My trusty {} gleams.", sword);
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn picks_up_one() {
        let inv = pick_up(Vec::new(), String::from("sword"));
        assert_eq!(inv, vec![String::from("sword")]);
