solution = '''
struct Point {
    x: i32,
    y: i32,
}

enum Color {
    Rgb(u8, u8, u8),
    Hsv(u16, u8, u8),
}

enum Message {
    Quit,
    Move { x: i32, y: i32 },
    Write(String),
    ChangeColor(Color),
}

/// "the origin", "on the x axis at 3", "on the y axis at -2", or "at (1, 2)"
fn locate(p: &Point) -> String {
    match p {
        Point { x: 0, y: 0 } => "the origin".to_string(),
        Point { x, y: 0 } => format!("on the x axis at {x}"),
        Point { x: 0, y } => format!("on the y axis at {y}"),
        Point { x, y } => format!("at ({x}, {y})"),
    }
}

/// "quit", "move to 3,4", "write: hi", "rgb 255 0 0" or "hsv 120 50 50"
fn describe(msg: &Message) -> String {
    match msg {
        Message::Quit => "quit".to_string(),
        Message::Move { x, y } => format!("move to {x},{y}"),
        Message::Write(text) => format!("write: {text}"),
        Message::ChangeColor(Color::Rgb(r, g, b)) => format!("rgb {r} {g} {b}"),
        Message::ChangeColor(Color::Hsv(h, s, v)) => format!("hsv {h} {s} {v}"),
    }
}

fn main() {
    println!("{}", locate(&Point { x: 3, y: 0 }));
    println!("{}", describe(&Message::Move { x: 3, y: 4 }));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn points() {
        assert_eq!(locate(&Point { x: 0, y: 0 }), "the origin");
        assert_eq!(locate(&Point { x: 3, y: 0 }), "on the x axis at 3");
        assert_eq!(locate(&Point { x: 0, y: -2 }), "on the y axis at -2");
        assert_eq!(locate(&Point { x: 1, y: 2 }), "at (1, 2)");
    }

    #[test]
    fn messages() {
        assert_eq!(describe(&Message::Quit), "quit");
        assert_eq!(describe(&Message::Move { x: 3, y: 4 }), "move to 3,4");
        assert_eq!(describe(&Message::Write("hi".to_string())), "write: hi");
        assert_eq!(describe(&Message::ChangeColor(Color::Rgb(255, 0, 0))), "rgb 255 0 0");
        assert_eq!(describe(&Message::ChangeColor(Color::Hsv(120, 50, 50))), "hsv 120 50 50");
    }
}
'''
hints = [
    "`locate` 需要四個分支，從最明確（兩個值都是 0）排到最一般。`describe` 每種變體各需要一個分支，而 `ChangeColor` 需要兩個。",
    "可以在同一個模式中混用常值和名稱：`Point { x, y: 0 }` 只會比對 `y` 為 0 的情況，並綁定 `x`。列舉也能巢狀比對：`Message::ChangeColor(Color::Rgb(r, g, b))`。",
    "```rust\nmatch p {\n    Point { x: 0, y: 0 } => \"the origin\".to_string(),\n    Point { x, y: 0 } => format!(\"on the x axis at {x}\"),\n    Point { x: 0, y } => format!(\"on the y axis at {y}\"),\n    Point { x, y } => format!(\"at ({x}, {y})\"),\n}\n```",
]

