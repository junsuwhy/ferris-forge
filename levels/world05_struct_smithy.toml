lesson = '''
若要用 `{:?}` 印出結構體，它必須具備 **Debug** 功能。可以請編譯器替你產生：

```rust
#[derive(Debug)]
struct Rectangle { width: u32, height: u32 }
```

`#[derive(...)]` 是會產生程式碼的**屬性**。（`{:#?}` 會以多行格式漂亮地印出內容。）

此外還有 **`dbg!(value)`**：它會將值、檔案名稱和行號印到標準錯誤，然後再把值傳回。這很適合快速除錯。

只讀取結構體的函式應該**借用**它：`fn area(rect: &Rectangle)`。
'''
c_compare = '''
C 不會自動印出結構體；`#[derive(Debug)]` 會替你產生列印程式碼。
'''
py_compare = '''
類似 `@dataclass` 自動提供的 `__repr__`。
'''
check = "output"
expected_output = '''
Rectangle { width: 30, height: 50 }
Area: 1500
'''
starter = '''
struct Rectangle {
    width: u32,
    height: u32,
}

fn area(rect: &Rectangle) -> u32 {
    todo!()
}

fn main() {
    let rect = Rectangle { width: 30, height: 50 };
    println!("{:?}", rect);
    println!("Area: {}", area(&rect));
}
'''
solution = '''
#[derive(Debug)]
struct Rectangle {
    width: u32,
    height: u32,
}

fn area(rect: &Rectangle) -> u32 {
    rect.width * rect.height
}

fn main() {
    let rect = Rectangle { width: 30, height: 50 };
    println!("{:?}", rect);
    println!("Area: {}", area(&rect));
}
'''
hints = [
    "要完成兩件事：讓結構體能用 `{:?}` 印出，並補上 `area` 函式。",
    "在 `struct Rectangle` 上方加上 `#[derive(Debug)]`，並在 `area` 裡將兩個欄位相乘。",
    "在結構體上方加上 `#[derive(Debug)]`，並將 `rect.width * rect.height` 作為 `area` 函式本體。",
]

[[level]]
id = "5.6"
title = "教結構體新把戲"
kind = "fill"
book = ["5.3"]
xp = 45
goal = "撰寫三個方法：`area`、`can_hold` 和 `grow`。"
lesson = '''
**方法**是附加在型別上的函式，寫在 `impl` 區塊中：

```rust
impl Rectangle {
    fn area(&self) -> u32 {          // 借用矩形
        self.width * self.height
    }
    fn widen(&mut self, by: u32) {   // 修改矩形
        self.width += by;
    }
}

rect.area();      // Rust 會自動幫你加上 &
rect.widen(5);    // ⋯⋯或 &mut
```

`&self` 用於讀取，`&mut self` 用於修改，而單獨的 `self` 會取得所有權（較少見）。
'''
c_compare = '''
在 C 中會寫成 `rect_area(&rect)`。方法的概念相同，但語法更簡潔，而且會自動加上 `&`。
'''
py_compare = '''
和 Python 方法類似，但 Rust 會寫成 `&self` 或 `&mut self`，明確指出如何借用。
'''
check = "tests"
starter = '''
struct Rectangle {
    width: u32,
    height: u32,
}

impl Rectangle {
    fn area(&self) -> u32 {
        todo!()
    }

    // 若 other 完全位於 self 內則回傳 true
    fn can_hold(&self, other: &Rectangle) -> bool {
        todo!()
    }

    // 將寬和高都增加 by
    fn grow(&mut self, by: u32) {
        todo!()
    }
}

fn main() {
    let mut r = Rectangle { width: 3, height: 4 };
    r.grow(1);
    println!("{}", r.area());
}
'''
solution = '''
struct Rectangle {
    width: u32,
    height: u32,
}

impl Rectangle {
    fn area(&self) -> u32 {
        self.width * self.height
    }

    // 若 other 完全位於 self 內則回傳 true
    fn can_hold(&self, other: &Rectangle) -> bool {
        self.width > other.width && self.height > other.height
    }

    // 將寬和高都增加 by
    fn grow(&mut self, by: u32) {
        self.width += by;
        self.height += by;
    }
}

fn main() {
    let mut r = Rectangle { width: 3, height: 4 };
    r.grow(1);
    println!("{}", r.area());
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn area() {
        assert_eq!(Rectangle { width: 3, height: 4 }.area(), 12);
    }

    #[test]
    fn can_hold() {
        let big = Rectangle { width: 10, height: 10 };
        let small = Rectangle { width: 2, height: 3 };
        assert!(big.can_hold(&small));
        assert!(!small.can_hold(&big));
    }

    #[test]
    fn grow() {
        let mut r = Rectangle { width: 3, height: 4 };
        r.grow(2);
        assert_eq!((r.width, r.height), (5, 6));
    }
}
'''
hints = [
    "在方法中，這個矩形就是 `self`，所以欄位是 `self.width` 和 `self.height`。",
    "`can_hold` 要比較 `self` 和 `other` 的寬與高。`grow` 則把 `by` 加到兩個欄位。",
    "`area`：`self.width * self.height`。`can_hold`：`self.width > other.width && self.height > other.height`。`grow`：`self.width += by; self.height += by;`。",
]

