[[level]]
id = "9.1"
title = "詢問玩家"
kind = "fill"
book = ["2"]
xp = 40
goal = '''從鍵盤讀取玩家名稱。遊戲會代替你輸入 "Ferris"，所以程式應該印出：
What's your name?
Hello, Ferris!'''
lesson = '''
現在要一步步打造真正的遊戲（這是 Rust 書籍第 2 章的內容）。

首先，讀取玩家輸入的內容：

```rust
use std::io;

let mut line = String::new();
io::stdin()
    .read_line(&mut line)          // 附加輸入的一整行，包含 Enter（\n）
    .expect("Failed to read line");
```

- `read_line` 需要 `&mut line`，因為它會**修改** String。
- 它會回傳 `Result`（讀取可能失敗），所以這裡使用 `expect`。
- 每行結尾都有換行字元；`.trim()` 會移除它。

在這座洞窟中，遊戲會代替你輸入玩家資料。開啟**輸出**面板中的**預期結果**分頁即可查看。
'''
c_compare = '''
類似 `fgets(buf, sizeof buf, stdin)`，但 String 會自動擴充，因此不會發生緩衝區溢位。
'''
py_compare = '''
類似 `name = input()`，但 Rust 會保留換行字元（因此需要 `.trim()`），也要求你處理可能發生的錯誤。
'''
check = "output"
stdin = "Ferris\n"
expected_output = '''
What's your name?
Hello, Ferris!
'''
starter = '''
use std::io;

fn main() {
    println!("What's your name?");
    let mut name = String::new();
    // TODO：從鍵盤讀取一行，存入 `name`
    println!("Hello, {}!", name.trim());
}
'''
solution = '''
use std::io;

fn main() {
    println!("What's your name?");
    let mut name = String::new();
    io::stdin().read_line(&mut name).expect("Failed to read line");
    println!("Hello, {}!", name.trim());
}
'''
hints = [
    "你需要使用 `io::stdin()` 和它的 `read_line` 方法。",
    "`read_line` 需要可變借用 `String`，並會回傳 `Result`。",
    "`io::stdin().read_line(&mut name).expect(\"Failed to read line\");`",
]

[[level]]
id = "9.2"
title = "把文字轉成數字"
kind = "fix"
book = ["2"]
xp = 45
goal = '''遊戲會代替你輸入 41。修正程式，讓它印出：
One more than your guess is 42'''
lesson = '''
玩家輸入的內容都是**文字**，也就是 `String`。若要進行數學運算，必須先轉換：

```rust
let guess: u32 = guess.trim().parse().expect("Please type a number!");
```

- `trim()` 移除結尾的換行字元
- `parse()` 將文字轉成數字；`: u32` 指定數字型別
- 它會回傳 `Result`，因為 `"abc"` 不是數字

注意我們重複使用名稱 `guess`。這叫做**遮蔽**：數字會取代同名的文字變數。
'''
c_compare = '''
類似 `strtol` 或 `atoi`，但失敗時會回傳真正的 `Err`，而不是悄悄回傳 0。
'''
py_compare = '''
類似 `int(input())`，但 Rust 會回傳錯誤值，而不是拋出 `ValueError`。
'''
check = "output"
stdin = "41\n"
expected_output = "One more than your guess is 42"
starter = '''
use std::io;

fn main() {
    let mut guess = String::new();
    io::stdin().read_line(&mut guess).expect("Failed to read line");
    let next = guess + 1;
    println!("One more than your guess is {}", next);
}
'''
solution = '''
use std::io;

fn main() {
    let mut guess = String::new();
    io::stdin().read_line(&mut guess).expect("Failed to read line");
    let guess: u32 = guess.trim().parse().expect("Please type a number!");
    let next = guess + 1;
    println!("One more than your guess is {}", next);
}
'''
hints = [
    "`guess` 目前還是文字，不能直接對文字加 1。",
    "先把它轉成數字：移除前後空白，再解析，並指定數值型別。",
    "在加法前加入 `let guess: u32 = guess.trim().parse().expect(\"Please type a number!\");`。",
]

[[level]]
id = "9.3"
title = "借用別人的骰子"
kind = "quiz"
book = ["2"]
xp = 20
goal = "將這些內容加入 Cargo.toml 後，下次執行 cargo build 會發生什麼事？"
lesson = '''
標準函式庫沒有提供亂數，因此書籍使用 **crates.io** 上名為 `rand` 的 **crate**（Rust 程式庫）。

將它加入 `Cargo.toml`：

```toml
[dependencies]
rand = "0.8.5"
```

再於程式碼中使用：

```rust
use rand::Rng;
let secret = rand::thread_rng().gen_range(1..=100);
```

Cargo 會下載 crate，並將選用的確切版本記錄在 **`Cargo.lock`**，確保明天建置時使用相同版本。

（這款遊戲的執行環境無法下載 crate，因此接下來的關卡會改用內建的「骰子」函式。）
'''
c_compare = '''
不用到處尋找標頭檔和 `.so` 檔案：只要在 Cargo.toml 加一行，Cargo 就會下載、建置並連結程式庫。
'''
py_compare = '''
類似在 `requirements.txt` 加上一行，但 Cargo 會自動為每個專案安裝套件。Cargo.lock 則像鎖定版本的檔案。
'''
starter = '''
[dependencies]
rand = "0.8.5"
'''
choices = [
    "直到你在程式碼中寫入 `use rand` 才會發生任何事",
    "Cargo 會從 crates.io 下載 rand 和它所需的依賴、進行編譯，並將確切版本記錄在 Cargo.lock",
    "Rust 會在電腦上為所有專案全域安裝 rand",
    "建置失敗：必須手動將 crate 複製到專案中",
]
answer = 1
explanation = "Cargo 會從 crates.io 解析相依套件、下載並編譯，再將確切版本寫入 Cargo.lock，讓之後的建置使用相同版本。"

[[level]]
id = "9.4"
title = "猜大猜小？"
kind = "fill"
book = ["2"]
xp = 45
goal = "比較玩家猜的數字和答案，撰寫 `judge` 並回傳 Too small!、Too big! 或 You win!。"
lesson = '''
使用 `.cmp()` 比較兩個數字會得到 **`Ordering`**，這個列舉有三種變體：

```rust
use std::cmp::Ordering;

match guess.cmp(&secret) {
    Ordering::Less => ...,
    Ordering::Greater => ...,
    Ordering::Equal => ...,
}
```

因為這是對列舉使用 `match`，Rust 會確保你處理全部三種情況。
'''
c_compare = '''
類似 `strcmp` 回傳的 `-1／0／1`，但使用列舉後不會誤解數值的意思。
'''
py_compare = '''
Python 會使用 `if / elif / else`。對 `Ordering` 使用 `match` 也能處理相同的三種情況，而且編譯器會檢查是否有遺漏。
'''
check = "tests"
starter = '''
use std::cmp::Ordering;

fn judge(guess: u32, secret: u32) -> String {
    todo!()
}

fn main() {
    println!("{}", judge(40, 31));
}
'''
solution = '''
use std::cmp::Ordering;

fn judge(guess: u32, secret: u32) -> String {
    match guess.cmp(&secret) {
        Ordering::Less => String::from("Too small!"),
        Ordering::Greater => String::from("Too big!"),
        Ordering::Equal => String::from("You win!"),
    }
}

fn main() {
    println!("{}", judge(40, 31));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn all_three() {
        assert_eq!(judge(10, 31), "Too small!");
        assert_eq!(judge(40, 31), "Too big!");
        assert_eq!(judge(31, 31), "You win!");
    }
}
'''
hints = [
    "使用 `guess.cmp(&secret)` 比較，並對結果進行 `match`。",
    "這裡有三個分支：`Ordering::Less`、`Ordering::Greater` 和 `Ordering::Equal`。每個分支都要回傳 `String`。",
    "```rust\nmatch guess.cmp(&secret) {\n    Ordering::Less => String::from(\"Too small!\"),\n    Ordering::Greater => String::from(\"Too big!\"),\n    Ordering::Equal => String::from(\"You win!\"),\n}\n```",
]

[[level]]
id = "9.5"
title = "頭目戰：猜數字遊戲"
kind = "boss"
book = ["2"]
xp = 120
goal = '''完成遊戲。玩家會依序輸入 50、abc、25、37、31（答案是 31）。
持續詢問直到猜中，且輸入 "abc" 時不能崩潰。請查看預期結果以確認正確輸出。'''
lesson = '''
**頭目戰！**把整個遊戲組合起來：

1. 使用 `loop { ... }` 持續迴圈。
2. 每一回合：印出 `Please input your guess.` 並讀取一行輸入。
   - 沒有更多輸入時，`read_line` 會回傳 `Ok(0)`。此時使用 `break`，避免遊戲無限迴圈。
3. 解析輸入。如果不是數字，就印出 `That's not a number!` 並使用 `continue`（再試一次）：

```rust
let guess: u32 = match guess.trim().parse() {
    Ok(num) => num,
    Err(_) => {
        println!("That's not a number!");
        continue;
    }
};
```

4. 印出 `You guessed: N`，接著比對並印出 `Too small!`、`Too big!` 或 `You win!`，猜中時使用 `break`。
'''
c_compare = '''
經典的 C 寫法使用 `scanf("%d")`，遇到字母輸入就會出問題。在這裡，只要多處理一個 `match` 分支即可。
'''
py_compare = '''
類似 `while True:` 搭配 `try: int(input())` 和 `except ValueError: continue`。
'''
check = "output"
stdin = "50\nabc\n25\n37\n31\n"
expected_output = '''
Guess the number!
Please input your guess.
You guessed: 50
Too big!
Please input your guess.
That's not a number!
Please input your guess.
You guessed: 25
Too small!
Please input your guess.
You guessed: 37
Too big!
Please input your guess.
You guessed: 31
You win!
'''
starter = '''
use std::cmp::Ordering;
use std::io;

// 遊戲內建的骰子。實際專案中會使用 rand crate：
//     rand::thread_rng().gen_range(1..=100)
fn secret_number() -> u32 {
    31
}

fn main() {
    println!("Guess the number!");
    let secret = secret_number();

    // TODO：持續迴圈：
    //   印出 "Please input your guess."
    //   讀取一行（read_line 回傳 Ok(0) 代表沒有更多輸入，此時停止）
    //   解析輸入；不是數字時，印出 "That's not a number!" 並重新嘗試
    //   印出 "You guessed: N"
    //   比較結果："Too small!"、"Too big!" 或 "You win!"（猜中後停止）
}
'''
solution = '''
use std::cmp::Ordering;
use std::io;

// 遊戲內建的骰子。實際專案中會使用 rand crate：
//     rand::thread_rng().gen_range(1..=100)
fn secret_number() -> u32 {
    31
}

fn main() {
    println!("Guess the number!");
    let secret = secret_number();

    loop {
        println!("Please input your guess.");
        let mut guess = String::new();
        let read = io::stdin().read_line(&mut guess).expect("Failed to read line");
        if read == 0 {
            break;
        }

        let guess: u32 = match guess.trim().parse() {
            Ok(num) => num,
            Err(_) => {
                println!("That's not a number!");
                continue;
            }
        };

        println!("You guessed: {guess}");
        match guess.cmp(&secret) {
            Ordering::Less => println!("Too small!"),
            Ordering::Greater => println!("Too big!"),
            Ordering::Equal => {
                println!("You win!");
                break;
            }
        }
    }
}
'''
hints = [
    "先完成迴圈和輸入讀取。`read_line` 回傳 0 時記得 `break`，否則遊戲永遠不會結束。",
    "用 `match` 解析輸入，遇到 `Err` 時 `continue`；接著對 `guess.cmp(&secret)` 使用 `match`。印出「You win!」後記得 `break`。",
    "```rust\nloop {\n    println!(\"Please input your guess.\");\n    let mut guess = String::new();\n    let read = io::stdin().read_line(&mut guess).expect(\"Failed to read line\");\n    if read == 0 { break; }\n    let guess: u32 = match guess.trim().parse() {\n        Ok(num) => num,\n        Err(_) => { println!(\"That's not a number!\"); continue; }\n    };\n    println!(\"You guessed: {guess}\");\n    match guess.cmp(&secret) {\n        Ordering::Less => println!(\"Too small!\"),\n        Ordering::Greater => println!(\"Too big!\"),\n        Ordering::Equal => { println!(\"You win!\"); break; }\n    }\n}\n```",
]
