id = 2
name = "流程森林"
blurb = "探索條件分支與迴圈：if、函式、loop、while 和 for。"

[[level]]
id = "2.1"
title = "岔路口"
kind = "fix"
book = ["3.5"]
xp = 30
goal = "修正程式，讓它印出：Status: wounded"
lesson = '''
在 Rust 中，**`if` 是運算式**，會產生一個值。因此你可以這樣寫：

```rust
let mood = if hungry { "grumpy" } else { "happy" };
```

要注意的是，兩個分支必須產生**相同型別**，因為 `mood` 只能有一種型別。
'''
c_compare = '''
這相當於 C 的三元運算子 `cond ? a : b`。Rust 沒有 `?:`，因為 `if` 本身就能做到同樣的事。
'''
py_compare = '''
類似 Python 的 `"grumpy" if hungry else "happy"`。不過 Python 允許兩個分支回傳不同型別，Rust 則不允許。
'''
check = "output"
expected_output = "Status: wounded"
starter = '''
fn main() {
    let health = 30;
    let status = if health > 50 { "healthy" } else { 10 };
    println!("Status: {}", status);
}
'''
solution = '''
fn main() {
    let health = 30;
    let status = if health > 50 { "healthy" } else { "wounded" };
    println!("Status: {}", status);
}
'''
hints = [
    "看看 `if` 兩個分支的型別，它們相同嗎？",
    "一個分支回傳字串，另一個回傳數字。`status` 只能有一種型別。",
    "把 `else` 分支改成 `{ \"wounded\" }`。",
]

[[level]]
id = "2.2"
title = "你的第一個函式"
kind = "fill"
book = ["3.3"]
xp = 30
goal = "撰寫 `square`，讓它回傳 n × n。Ferris 會用測試確認結果。"
lesson = '''
函式使用 **`fn`** 宣告。參數必須標示型別，回傳型別則寫在 `->` 後面：

```rust
fn add(a: i32, b: i32) -> i32 {
    a + b
}
```

注意最後一行**不需要 `return`，也不需要分號**。函式最後一個*運算式*就是回傳值。（寫成 `return a + b;` 也可以，但慣用的 Rust 寫法會省略它。）

`todo!()` 是暫用的佔位巨集，執行到它時會讓程式 panic。請把它替換掉！
'''
c_compare = '''
類似 `int add(int a, int b) { return a + b; }`，只是 Rust 把型別寫在參數名稱後面。與 C 不同，函式的定義順序不重要，也不需要函式原型。
'''
py_compare = '''
類似 `def add(a, b): return a + b`，但 Rust 強制要求型別，例如 `a: i32`。可以把它想成由編譯器確實檢查的 Python 型別提示。
'''
check = "tests"
starter = '''
fn square(n: i32) -> i32 {
    todo!()
}

fn main() {
    println!("7 squared is {}", square(7));
}
'''
solution = '''
fn square(n: i32) -> i32 {
    n * n
}

fn main() {
    println!("7 squared is {}", square(7));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn squares_positive() {
        assert_eq!(square(3), 9);
    }

    #[test]
    fn squares_negative() {
        assert_eq!(square(-4), 16);
    }

    #[test]
    fn squares_zero() {
        assert_eq!(square(0), 0);
    }
}
'''
hints = [
    "把 `todo!()` 換成一個會用到 `n` 的運算式。",
    "函式最後一個沒有加 `;` 的運算式，就是它的回傳值。",
    "函式本體只要寫 `n * n`。",
]

[[level]]
id = "2.3"
title = "偷偷作怪的分號"
kind = "fix"
book = ["3.3"]
xp = 30
goal = "修正程式，讓它印出：42"
lesson = '''
這條 Rust 規則常讓初學者第一次遇到時感到意外：

- `n * 2` 是**運算式**，會產生一個值。
- `n * 2;` 是**陳述式**。分號會丟掉運算式的值，留下 `()`（讀作「unit」，代表 Rust 中的「沒有值」）。

因此，函式最後一行若加上分號，回傳的就會是 `()`，而不是你要的數字。
'''
c_compare = '''
在 C 中，非 `void` 函式直接跑到結尾屬於未定義行為（編譯器可能會警告）。Rust 則會明確回報型別錯誤：「預期 `i32`，卻得到 `()`」。
'''
py_compare = '''
這就像在 Python 忘了寫 `return`，結果得到 `None`。不同的是，Rust 會在編譯時就抓到問題。
'''
check = "output"
expected_output = "42"
starter = '''
fn double(n: i32) -> i32 {
    n * 2;
}

fn main() {
    println!("{}", double(21));
}
'''
solution = '''
fn double(n: i32) -> i32 {
    n * 2
}

fn main() {
    println!("{}", double(21));
}
'''
hints = [
    "錯誤指出函式回傳了 `()`。函式的回傳值是從哪裡來的？",
    "第 2 行有一個字元，讓運算式變成了陳述式。",
    "移除 `n * 2` 後面的 `;`。",
]

[[level]]
id = "2.4"
title = "會帶回答案的迴圈"
kind = "predict"
book = ["3.5"]
xp = 20
goal = "這段程式會印出什麼？"
lesson = '''
**`loop`** 會不斷重複，直到遇到 `break`。而且 `break` 可以**帶著值**離開迴圈：

```rust
let found = loop {
    // ...
    break 42;
};
```
'''
starter = '''
fn main() {
    let mut counter = 0;
    let result = loop {
        counter += 1;
        if counter == 4 {
            break counter * 10;
        }
    };
    println!("{}", result);
}
'''
choices = ["4", "40", "30", "無法編譯：迴圈不會產生值"]
answer = 1
expected_output = "40"
explanation = "迴圈會執行到 `counter` 等於 4，接著 `break counter * 10` 會讓整個 `loop` 運算式的值成為 40，並存入 `result`。"

[[level]]
id = "2.5"
title = "數數樹木"
kind = "fill"
book = ["3.5"]
xp = 35
goal = "使用 for 迴圈撰寫 `sum_to(n)`，計算 1 + 2 + … + n 的總和。"
lesson = '''
**`for`** 可以逐一走訪任何可迭代的項目。最簡單的方式是使用**範圍**：

```rust
for i in 0..3 { }    // 0、1、2（不包含結尾）
for i in 1..=3 { }   // 1、2、3（= 表示包含結尾）
```

要累加數值，需要一個會改變的變數，所以別忘了加上 `mut`。
'''
c_compare = '''
`for i in 1..=n` 可以取代 `for (int i = 1; i <= n; i++)`。不用自己維護索引，因此少了出錯的機會。
'''
py_compare = '''
`for i in 1..=n` 類似 `for i in range(1, n + 1)`；`1..n` 則類似 `range(1, n)`。
'''
check = "tests"
starter = '''
fn sum_to(n: u32) -> u32 {
    todo!()
}

fn main() {
    println!("1 + 2 + ... + 10 = {}", sum_to(10));
}
'''
solution = '''
fn sum_to(n: u32) -> u32 {
    let mut total = 0;
    for i in 1..=n {
        total += i;
    }
    total
}

fn main() {
    println!("1 + 2 + ... + 10 = {}", sum_to(10));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn sum_to_one() {
        assert_eq!(sum_to(1), 1);
    }

    #[test]
    fn sum_to_ten() {
        assert_eq!(sum_to(10), 55);
    }

    #[test]
    fn sum_to_zero_is_zero() {
        assert_eq!(sum_to(0), 0);
    }
}
'''
hints = [
    "你需要一個從 0 開始、並在迴圈中持續累加的總和變數。",
    "先寫 `let mut total = 0;`，用 `for i in 1..=n` 迴圈，每次把 `i` 加進總和，最後以 `total` 作為函式的回傳值。",
    "```rust\nlet mut total = 0;\nfor i in 1..=n {\n    total += i;\n}\ntotal\n```",
]

