[[level]]
id = "6.2"
title = "有值或沒有值"
kind = "fix"
book = ["6.1"]
xp = 40
goal = "修正程式，讓它印出：Ferris is at spot 2"
lesson = '''
Rust **沒有 null**。值可能不存在時，型別會明確表示：

```rust
enum Option<T> {
    Some(T),   // 有值
    None,      // 沒有值
}
```

`Option<usize>` **不是** `usize`，因此不能直接拿來運算。你必須先處理 `None` 的情況，這就是為什麼不會發生 null 指標崩潰。

最快的取值方法是 `.unwrap()`：它會取得值，但遇到 `None` 時會**崩潰**。只有確定有值時才使用。較安全的做法是 `.unwrap_or(default)`。下一關會介紹正規工具：`match`。
'''
c_compare = '''
在 C 中，回傳指標的函式可能回傳 `NULL`，而忘記檢查就是所謂的「十億美元錯誤」。`Option` 讓你不可能忘記處理。
'''
py_compare = '''
類似 Python 中可能回傳 `None` 的函式，但 Rust 不會讓你把結果當成永遠不會是 `None` 來使用。
'''
check = "output"
expected_output = "Ferris is at spot 2"
starter = '''
fn find_crab(names: &[&str]) -> Option<usize> {
    for (i, name) in names.iter().enumerate() {
        if *name == "Ferris" {
            return Some(i);
        }
    }
    None
}

fn main() {
    let beach = ["Gull", "Ferris", "Seal"];
    let spot = find_crab(&beach);
    println!("Ferris is at spot {}", spot + 1);
}
'''
solution = '''
fn find_crab(names: &[&str]) -> Option<usize> {
    for (i, name) in names.iter().enumerate() {
        if *name == "Ferris" {
            return Some(i);
        }
    }
    None
}

fn main() {
    let beach = ["Gull", "Ferris", "Seal"];
    let spot = find_crab(&beach).unwrap();
    println!("Ferris is at spot {}", spot + 1);
}
'''
hints = [
    "`spot` 的型別是 `Option<usize>`，不是數字。要加 1 之前需要先做什麼？",
    "從 `Option` 取出數字。這裡我們確定 Ferris 就在海灘上。",
    "`let spot = find_crab(&beach).unwrap();`",
]

