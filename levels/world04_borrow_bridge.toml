[[level]]
id = "4.10"
title = "頭目戰：單字計數器"
kind = "boss"
book = ["4.4", "4.5"]
xp = 100
goal = '''撰寫三個函式：
count_words：計算文字中的單字數量
longest_word：回傳第一個最長的單字（沒有單字時回傳 ""）
shout：直接將 String 改為大寫，並在最後加上 "!"'''
lesson = '''
**頭目戰！**在同一關中運用借用橋學過的所有內容。

可使用以下新方法：

```rust
for word in text.split_whitespace() { /* 每個單字都是 &str */ }
let loud = text.to_uppercase();   // 建立新的 String
```

想想哪些函式只會**讀取**文字（接收 `&str`），哪些會**修改**文字（接收 `&mut String`）。`longest_word` 會回傳從輸入借用的切片。
'''
c_compare = '''
在 C 中，你得手動用 `strtok` 切分單字（而且它會修改字串！）。這裡的 `split_whitespace` 會提供安全的借用切片。
'''
py_compare = '''
`split_whitespace` 類似不帶參數的 Python `str.split()`，但它會產生借用切片，而不是新的字串。
'''
check = "tests"
starter = '''
fn count_words(text: &str) -> usize {
    todo!()
}

fn longest_word(text: &str) -> &str {
    todo!()
}

fn shout(text: &mut String) {
    todo!()
}

fn main() {
    let mut cry = String::from("cross the bridge");
    println!("{} words, longest: {}", count_words(&cry), longest_word(&cry));
    shout(&mut cry);
    println!("{}", cry);
}
'''
solution = '''
fn count_words(text: &str) -> usize {
    text.split_whitespace().count()
}

fn longest_word(text: &str) -> &str {
    let mut best = "";
    for word in text.split_whitespace() {
        if word.len() > best.len() {
            best = word;
        }
    }
    best
}

fn shout(text: &mut String) {
    *text = text.to_uppercase();
    text.push('!');
}

fn main() {
    let mut cry = String::from("cross the bridge");
    println!("{} words, longest: {}", count_words(&cry), longest_word(&cry));
