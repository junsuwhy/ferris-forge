FOR FERRIS!!!'''
lesson = '''
把值傳給函式時，和指派一樣，值會**移動到函式裡**。函式參數成為新的擁有者，函式結束時就會丟棄該值。

因此，呼叫 `shout(battle_cry)` 之後，`main` 就不再擁有 `battle_cry`。

（下一章「借用橋」會介紹更好的方式：使用 `&` *借出*值，而不交出所有權。目前先運用已學會的內容。）
'''
c_compare = '''
這就像每個接收 `String` 的函式都註明「本函式會取得參數所有權並呼叫 `free()`」。Rust 把這項約定納入型別，並由編譯器強制檢查。
'''
py_compare = '''
在 Python 中，把物件傳給函式後仍可繼續使用；在 Rust 中，傳入擁有所有權的值就等於把它交出去。
'''
check = "output"
expected_output = '''
FOR FERRIS!!!
FOR FERRIS!!!
'''
starter = '''
fn shout(s: String) {
    println!("{}!!!", s.to_uppercase());
}

fn main() {
    let battle_cry = String::from("for ferris");
    shout(battle_cry);
    shout(battle_cry);
}
'''
solution = '''
fn shout(s: String) {
    println!("{}!!!", s.to_uppercase());
}

fn main() {
    let battle_cry = String::from("for ferris");
    shout(battle_cry.clone());
    shout(battle_cry);
}
'''
hints = [
    "第一次呼叫 `shout(battle_cry)` 之後，文字的所有權歸誰？",
    "第一次呼叫會把 `battle_cry` 移進函式。第一次呼叫時傳入副本，最後一次呼叫再傳入原本的值。",
