lesson = '''
**頭目戰！**打造一位英雄：

- `Hero::new(name)` 建立等級 1、生命值為 10／10 的英雄。
- `take_damage(n)` 扣除生命值，但不能低於 0。使用 `self.hp.saturating_sub(n)`。
- `heal(n)` 恢復生命值，但不能超過 `max_hp`。使用 `.min(...)`。
- `level_up()`：等級加 1、`max_hp` 加 5，生命值補滿。
- `is_alive()`：生命值大於 0 時回傳存活。
- `describe()` 回傳類似 `Ferris (lvl 2) 15/15 HP` 的文字（使用 `format!`）。

請為每個方法選擇 `&self` 或 `&mut self`。
'''
c_compare = '''
`saturating_sub` 會在 0 停住，不會像 C 的無號整數減法那樣繞回約 40 億。
'''
py_compare = '''
類似含有方法的 Python 類別，但 Rust 方法的 `self` 會明確指出是否會修改英雄。
'''
check = "tests"
