}
'''
solution = '''
fn parse_level(text: &str) -> Result<u32, String> {
    match text.trim().parse::<u32>() {
        Ok(n) => Ok(n),
        Err(_) => Err(format!("'{}' is not a number", text)),
    }
}

fn main() {
    match parse_level("7") {
        Ok(n) => println!("Level {}", n + 1),
        Err(e) => println!("Error: {}", e),
    }

    match parse_level("seven") {
        Ok(n) => println!("Level {}", n + 1),
        Err(e) => println!("Error: {}", e),
    }
}
