這個函式取得**兩個** `String` 的所有權，並回傳**其中一個**。另一個會怎麼處理？函式結束時會自動**丟棄**，不會記憶體洩漏，也不需要呼叫 `free()`。

`s.len()` 會回傳 `String` 的位元組長度。
'''
