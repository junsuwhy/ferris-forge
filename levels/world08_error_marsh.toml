goal = "`Guess::new` 遇到 1 到 100 以外的數字時會 panic；`Guess::try_new` 則會回傳 `Err`。"
lesson = '''
什麼時候應該觸發 **panic**，什麼時候應該回傳 **`Result`**？

- 若失敗是呼叫端可以處理的常見情況（輸入錯誤、檔案不存在），就**回傳 `Result`**。
- 若繼續執行代表程式本身有錯（違反程式內部的保證），就觸發 **panic**。

一個好方法是建立**已驗證型別**：`Guess` 只能存放 1 到 100。建立時檢查一次，之後所有接收 `Guess` 的函式都能信任其值。

```rust
if value < 1 || value > 100 {
    panic!("Guess must be between 1 and 100, got {value}");
}
```
'''
c_compare = '''
類似在建構函式中檢查一次，並使用 `assert` 找出程式自身的錯誤；而且檢查不會被編譯器移除。
'''
py_compare = '''
類似在 `__init__` 中拋出 `ValueError`。Rust 提供兩種方式：panic（`new`）或 `Result`（`try_new`）。
'''
check = "tests"
starter = '''
pub struct Guess {
    value: i32,
}

impl Guess {
    pub fn new(value: i32) -> Guess {
        // TODO：value 不在 1..=100 範圍時，觸發 panic!("Guess must be between 1 and 100, got {value}")
        Guess { value }
    }

    pub fn try_new(value: i32) -> Result<Guess, String> {
        // TODO：value 不在 1..=100 範圍時，回傳 Err("out of range".to_string())
        todo!()
    }

    pub fn value(&self) -> i32 {
        self.value
    }
}

fn main() {
    println!("{}", Guess::new(42).value());
}
'''
solution = '''
pub struct Guess {
    value: i32,
}

impl Guess {
    pub fn new(value: i32) -> Guess {
        if value < 1 || value > 100 {
            panic!("Guess must be between 1 and 100, got {value}");
        }
        Guess { value }
    }

    pub fn try_new(value: i32) -> Result<Guess, String> {
        if value < 1 || value > 100 {
            return Err("out of range".to_string());
        }
        Ok(Guess { value })
    }

    pub fn value(&self) -> i32 {
        self.value
    }
}

fn main() {
    println!("{}", Guess::new(42).value());
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn in_range() {
        assert_eq!(Guess::new(50).value(), 50);
        assert_eq!(Guess::new(1).value(), 1);
        assert_eq!(Guess::new(100).value(), 100);
    }

    #[test]
    #[should_panic(expected = "between 1 and 100")]
    fn too_big_panics() {
        Guess::new(200);
    }

    #[test]
    #[should_panic(expected = "between 1 and 100")]
    fn zero_panics() {
        Guess::new(0);
    }

    #[test]
    fn try_new_copes() {
        assert_eq!(Guess::try_new(7).map(|g| g.value()), Ok(7));
        assert!(Guess::try_new(101).is_err());
    }
}
'''
hints = [
    "兩個函式都要檢查相同的範圍，一個會 panic，另一個則回傳 `Err`。",
    "檢查 `if value < 1 || value > 100`。在 `new` 中呼叫 `panic!(...)`；在 `try_new` 中使用 `return Err(...)`，最後回傳 `Ok(Guess { value })`。",
    "```rust\nif value < 1 || value > 100 {\n    panic!(\"Guess must be between 1 and 100, got {value}\");\n}\n```",
]

