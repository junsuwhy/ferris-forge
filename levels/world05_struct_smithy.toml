lesson = '''
大多數結構體會**擁有**自己的資料，因此使用 `String` 而非 `&str`：

```rust
struct Pet { name: String }   // Pet 擁有自己的名稱
```

結構體*也可以*存放借用的 `&str`，但 Rust 必須知道借用會持續多久。這需要使用**生命週期**，你會在生命週期迷宮學到。目前先記得：**擁有資料的欄位比較簡單**。
'''
