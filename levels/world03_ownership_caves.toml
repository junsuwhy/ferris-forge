id = 3
name = "所有權洞窟"
blurb = "Rust 的核心概念：每個值都只有一個擁有者。"

[[level]]
id = "3.1"
title = "石中劍"
kind = "fix"
book = ["4.1"]
xp = 40
goal = '''修正程式，讓它印出：
The hero holds Excalibur
The stone still shows Excalibur'''
lesson = '''
歡迎來到 Rust 最重要的洞窟。**所有權的三項規則**：

1. 每個值都有**一位擁有者**（變數）。
2. 同一時間只能有**一位擁有者**。
3. 擁有者離開作用域時，值就會被**丟棄**（釋放）。

因此，對 `String` 執行 `let b = a;` 會將值**移動**：現在由 `b` 擁有文字，而 `a` 不再有效。之後再使用 `a` 就會得到錯誤 **E0382**。

如果真的需要兩份獨立的副本，請明確呼叫 **`.clone()`** 建立一份。
'''
c_compare = '''
`String` 會指向堆積記憶體（並記錄長度與容量）。如果 `let b = a;` 複製了指標，就會有兩個擁有者，也會呼叫兩次 **`free()`**，造成重複釋放！Rust 會改為*移動*所有權，確保只有一個變數負責釋放記憶體。不必擔心忘了呼叫 `free()`，也不會呼叫兩次。
'''
py_compare = '''
在 Python 中，`b = a` 會讓兩個名稱指向同一個物件，之後由垃圾回收器釋放。Rust 沒有垃圾回收器，而是在編譯時追蹤唯一的擁有者，所以原本的名稱會失效。
'''
check = "output"
expected_output = '''
The hero holds Excalibur
The stone still shows Excalibur
'''
starter = '''
fn main() {
    let sword = String::from("Excalibur");
    let hero_item = sword;
    println!("The hero holds {}", hero_item);
    println!("The stone still shows {}", sword);
}
'''
solution = '''
fn main() {
    let sword = String::from("Excalibur");
    let hero_item = sword.clone();
    println!("The hero holds {}", hero_item);
    println!("The stone still shows {}", sword);
}
'''
hints = [
    "第 3 行之後，這個 `String` 由誰擁有？還能繼續使用 `sword` 嗎？",
    "所有權已*移動*到 `hero_item`。若想繼續使用 `sword`，就要讓 `hero_item` 擁有一份文字副本。",
    "在第 3 行寫上 `let hero_item = sword.clone();`。",
]

[[level]]
id = "3.2"
title = "複製還是移動？"
kind = "predict"
book = ["4.1"]
xp = 25
goal = "這段程式能編譯嗎？如果可以，會印出什麼？"
lesson = '''
不是所有值都會移動！完全存放在堆疊上的簡單值，例如整數、浮點數、`bool` 和 `char`，都實作了 **`Copy`**：指派時會快速複製，因此兩個變數都能繼續使用。

像 `String` 這樣擁有堆積記憶體的型別，則會被**移動**。
'''
starter = '''
fn main() {
    let a = 5;
    let b = a;
    let s1 = String::from("hi");
    let s2 = s1;
    println!("{} {}", a, b);
    println!("{}", s2);
}
'''
choices = [
    "5 5 / hi",
    "無法編譯：a 已移動到 b",
    "無法編譯：s1 已移動到 s2",
    "5 0 / hi",
]
answer = 0
expected_output = '''
5 5
hi
'''
explanation = "`i32` 實作了 `Copy`，所以 `a` 和 `b` 都是 5。`s1` 的確已*移動*到 `s2`，但之後沒有再使用 `s1`，因此不會出錯。移動本身沒有問題；問題在於移動後又使用舊名稱。"

[[level]]
id = "3.3"
title = "洞窟中的回音"
kind = "fix"
book = ["4.1"]
