[[level]]
id = "4.7"
title = "一片字串"
kind = "fill"
book = ["4.4"]
xp = 45
goal = "撰寫 `first_word`：回傳字串中的第一個單字（第一個空格之前的內容）。"
lesson = '''
**切片**會借用某個值的*一部分*。字串切片的型別是 **`&str`**：

```rust
let s = String::from("hello world");
let hello = &s[0..5];   // 從位元組索引 0 到 5（不包含 5）
let world = &s[6..];    // 從索引 6 到結尾
```

`"hi"` 這類字串常值也是 `&str`。需要 `&str` 的地方可以自動使用 `&String`，因此 `&str` 參數兩種都接受。

要尋找空格，可以逐一檢查位元組：

```rust
for (i, b) in s.bytes().enumerate() {
    if b == b' ' { /* 在索引 i 找到空格 */ }
}
```
'''
c_compare = '''
`&str` 是指標加上長度，類似 `(const char *, size_t)` 配對。不需要空字元結尾，也不會複製文字。
'''
py_compare = '''
類似 Python 的 `s[0:5]`，但 Rust 切片不會複製文字，而是借用原字串的一段內容。
'''
check = "tests"
starter = '''
fn first_word(s: &str) -> &str {
    todo!()
}

fn main() {
    println!("{}", first_word("hello world"));
}
'''
solution = '''
fn first_word(s: &str) -> &str {
    for (i, b) in s.bytes().enumerate() {
        if b == b' ' {
            return &s[..i];
        }
    }
    s
}

fn main() {
    println!("{}", first_word("hello world"));
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn two_words() {
        assert_eq!(first_word("hello world"), "hello");
    }

    #[test]
    fn one_word() {
        assert_eq!(first_word("crab"), "crab");
    }

    #[test]
    fn works_with_a_string_too() {
        let s = String::from("rusty bridge");
        assert_eq!(first_word(&s), "rusty");
    }

    #[test]
    fn empty() {
        assert_eq!(first_word(""), "");
    }
}
'''
hints = [
    "逐一檢查位元組，直到找到空格。找到時要回傳什麼？如果完全沒有空格呢？",
    "使用 `for (i, b) in s.bytes().enumerate()`。如果 `b == b' '`，就回傳空格前的切片。迴圈結束後，整個字串就是一個單字。",
    "```rust\nfor (i, b) in s.bytes().enumerate() {\n    if b == b' ' {\n        return &s[..i];\n    }\n}\ns\n```",
]

