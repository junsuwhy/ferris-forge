[[level]]
id = "5.1"
title = "打造第一個結構體"
kind = "fill"
book = ["5.1"]
xp = 40
goal = "定義 `Crab` 結構體，讓程式印出：Ferris has 8 legs"
lesson = '''
**結構體（struct）**會將相關的值組合在同一個名稱下：

```rust
struct Player {
    name: String,
    score: u32,
}

let p = Player { name: String::from("Ana"), score: 7 };
println!("{}", p.name);   // 使用點號讀取欄位
```

每個欄位都有名稱和型別。結構體名稱使用 `CamelCase`。
'''
c_compare = '''
幾乎和 C 的 `struct` 相同，但不必另外使用 `typedef`。結構體會**擁有**其中的 `String`（結構體丟棄時會一併釋放）。
'''
py_compare = '''
類似 Python 的 `@dataclass`，但欄位型別會在編譯時檢查。
'''
check = "output"
expected_output = "Ferris has 8 legs"
starter = '''
// TODO：定義名為 Crab 的結構體，包含兩個欄位：
//   name：String
//   legs：u32

fn main() {
    let ferris = Crab { name: String::from("Ferris"), legs: 8 };
    println!("{} has {} legs", ferris.name, ferris.legs);
}
'''
solution = '''
struct Crab {
    name: String,
    legs: u32,
}

fn main() {
    let ferris = Crab { name: String::from("Ferris"), legs: 8 };
    println!("{} has {} legs", ferris.name, ferris.legs);
}
'''
hints = [
    "編譯器找不到名為 `Crab` 的型別。你需要在 `main` 上方定義它。",
    "寫出 `struct Crab { ... }`，每個欄位的格式都是 `name: Type,`。",
    "```rust\nstruct Crab {\n    name: String,\n    legs: u32,\n}\n```",
]

[[level]]
id = "5.2"
title = "複製藍圖"
kind = "predict"
book = ["5.1"]
xp = 25
goal = "這段程式能編譯嗎？如果可以，會印出什麼？"
lesson = '''
建立結構體時有兩種簡寫方式：

- **欄位初始化簡寫**：變數名稱和欄位相同時，只要寫一次：`Hero { name, level }`。
- **結構體更新語法**：使用 `..other` 從另一個結構體帶入其餘欄位。

```rust
let b = Hero { level: 2, ..a };   // 其他欄位沿用 a 的值
```

注意：`..a` 會將未實作 `Copy` 的欄位（例如 `String`）從 `a` **移動**出去。
'''
c_compare = '''
在 C 中，使用 `=` 會複製整個結構體，包括指向名稱的指標，導致兩個結構體都「擁有」它。Rust 則會移動 `String`。
'''
py_compare = '''
類似 `dataclasses.replace(a, level=2)`，但這裡的名稱會被移動，而不是共用。
'''
starter = '''
struct Hero {
    name: String,
    level: u32,
}

fn main() {
    let a = Hero { name: String::from("Ferris"), level: 1 };
    let b = Hero { level: 2, ..a };
    println!("{} {}", b.name, b.level);
    println!("{}", a.level);
}
'''
choices = [
    "Ferris 2 / 1",
    "無法編譯：a 已移動到 b",
    "Ferris 1 / 1",
    "Ferris 2 / 2",
]
answer = 0
expected_output = '''
Ferris 2
1
'''
explanation = "`..a` 只會移動實際使用到的欄位：`name` 移入 `b`，但 `a.level` 是實作 `Copy` 的 `u32`，而且 `b` 已設定自己的 level，因此 `a.level` 仍可使用。若使用 `a.name`（或整個 `a`）就會失敗。"

[[level]]
id = "5.3"
title = "小巧的元組結構體"
kind = "fill"
book = ["5.1"]
xp = 40
goal = "定義 `Feet`，再撰寫 `to_feet`（1 公尺 = 3.28084 英尺）。"
lesson = '''
**元組結構體**是有名稱的元組。欄位以位置區分，而不是使用名稱：

```rust
struct Meters(f64);
let m = Meters(5.0);
println!("{}", m.0);
```

為什麼要這麼做？`Meters` 和 `Feet` 是**不同型別**，因此即使兩者都存放 `f64`，也不會不小心混用。

還有完全沒有欄位的**單元結構體**：`struct Marker;`。
'''
c_compare = '''
類似 `typedef struct { double v; } Meters;`，但不會增加執行成本，也不可能和 `Feet` 混淆。
'''
py_compare = '''
Python 的 `typing.NewType` 只是提示；在 Rust 中，需要 `Meters` 卻傳入 `Feet` 會造成編譯錯誤。
'''
check = "tests"
starter = '''
struct Meters(f64);
// TODO：定義存放 f64 的元組結構體 Feet

fn to_feet(m: Meters) -> Feet {
    todo!()
}

fn main() {
    let f = to_feet(Meters(2.0));
    println!("{:.2} feet", f.0);
}
'''
solution = '''
struct Meters(f64);
struct Feet(f64);

fn to_feet(m: Meters) -> Feet {
    Feet(m.0 * 3.28084)
}

fn main() {
    let f = to_feet(Meters(2.0));
    println!("{:.2} feet", f.0);
}
'''
tests = '''
#[cfg(test)]
mod tests {
    use super::*;

    #[test]
    fn ten_meters() {
        assert!((to_feet(Meters(10.0)).0 - 32.8084).abs() < 1e-9);
    }

    #[test]
    fn zero_meters() {
        assert_eq!(to_feet(Meters(0.0)).0, 0.0);
    }
}
'''
hints = [
    "先比照 `Meters` 的寫法定義 `Feet`。",
    "在 `to_feet` 裡用 `m.0` 取出數值、進行乘法，再用 `Feet(...)` 包住結果。",
    "宣告 `struct Feet(f64);`，函式本體回傳 `Feet(m.0 * 3.28084)`。",
]

[[level]]
