lesson = '''
再來介紹四種工具：

**忽略**不需要的部分：`_` 略過一個值，`..` 略過其餘所有值。

```rust
let (first, .., last) = (1, 2, 3, 4, 5);   // first = 1，last = 5
```

使用額外條件為分支加上**守衛**：

```rust
match n {
    Some(x) if x < 0 => "negative",
    Some(_) => "零或正數",
    None => "nothing",
}
```

使用 `@` 檢查值時，同時為它**命名**：

```rust
match age {
    kid @ 0..=12 => format!("child ({kid})"),
    ...
}
```

若不使用 `@`，你只能檢查範圍*或*保留值，無法兩者兼得。
'''
